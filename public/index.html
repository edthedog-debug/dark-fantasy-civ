import pygame
import sys

# --- Configuration ---
WIDTH, HEIGHT = 800, 600
FPS = 60
WHITE, BLACK = (255, 255, 255), (0, 0, 0)
PADDLE_SPEED = 7
BALL_BASE_SPEED = 5

# --- Classes ---
class Paddle(pygame.sprite.Sprite):
    def __init__(self, x, y, height=100):
        super().__init__()
        self.image = pygame.Surface([10, height])
        self.image.fill(WHITE)
        self.rect = self.image.get_rect(center=(x, y))

    def move(self, dy):
        self.rect.y += dy
        self.rect.clamp_ip(pygame.Rect(0, 0, WIDTH, HEIGHT))

class Ball(pygame.sprite.Sprite):
    def __init__(self, speed=BALL_BASE_SPEED):
        super().__init__()
        self.image = pygame.Surface([15, 15])
        self.image.fill(WHITE)
        self.rect = self.image.get_rect(center=(WIDTH // 2, HEIGHT // 2))
        self.speed = [speed, speed]
        # Randomize initial vertical direction
        if pygame.time.get_ticks() % 2 == 0:
            self.speed[1] *= -1

    def update(self):
        self.rect.x += self.speed[0]
        self.rect.y += self.speed[1]

        # Wall collision (top/bottom)
        if self.rect.top <= 0 or self.rect.bottom >= HEIGHT:
            self.speed[1] *= -1

        # Check if ball is out of bounds
        if self.rect.left <= 0:
            return -1  # Right player scores
        if self.rect.right >= WIDTH:
            return 1   # Left player scores
        return 0

    def reset(self):
        self.__init__()

class Game:
    def __init__(self):
        pygame.init()
        self.screen = pygame.display.set_mode((WIDTH, HEIGHT))
        pygame.display.set_caption("Improved Pong")
        self.clock = pygame.time.Clock()
        self.font = pygame.font.Font(None, 48)

        self.player1 = Paddle(30, HEIGHT // 2)
        self.player2 = Paddle(WIDTH - 30, HEIGHT // 2)
        self.ball = Ball()
        self.all_sprites = pygame.sprite.Group(self.ball)

        self.score = [0, 0]
        self.running = True

    def handle_events(self):
        for event in pygame.event.get():
            if event.type == pygame.QUIT:
                self.running = False

    def handle_input(self):
        keys = pygame.key.get_pressed()
        if keys[pygame.K_w]:
            self.player1.move(-PADDLE_SPEED)
        if keys[pygame.K_s]:
            self.player1.move(PADDLE_SPEED)
        if keys[pygame.K_UP]:
            self.player2.move(-PADDLE_SPEED)
        if keys[pygame.K_DOWN]:
            self.player2.move(PADDLE_SPEED)

    def update(self):
        score_result = self.ball.update()
        if score_result != 0:
            self.score[-score_result] += 1
            self.ball.reset()

        # Paddle collision
        if self.ball.rect.colliderect(self.player1.rect) or self.ball.rect.colliderect(self.player2.rect):
            self.ball.speed[0] *= -1.05  # Slight speed increase
            paddle = self.player1 if self.ball.rect.colliderect(self.player1.rect) else self.player2
            hit_offset = (self.ball.rect.centery - paddle.rect.centery) / 50
            self.ball.speed[1] += hit_offset

    def draw(self):
        self.screen.fill(BLACK)
        self.all_sprites.draw(self.screen)
        pygame.draw.line(self.screen, WHITE, (WIDTH // 2, 0), (WIDTH // 2, HEIGHT), 2)

        score_text = f"{self.score[0]}  {self.score[1]}"
        txt_surface = self.font.render(score_text, True, WHITE)
        txt_rect = txt_surface.get_rect(center=(WIDTH // 2, 40))
        self.screen.blit(txt_surface, txt_rect)

        pygame.display.flip()

    def run(self):
        while self.running:
            self.handle_events()
            self.handle_input()
            self.update()
            self.draw()
            self.clock.tick(FPS)

        pygame.quit()
        sys.exit()

if __name__ == "__main__":
    Game().run()
</script>
