<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sovereign AI Engine - World Map</title>
    <style>
        :root {
            --bg-primary: #070913;
            --bg-panel: rgba(16, 22, 36, 0.9);
            --bg-card: rgba(25, 33, 52, 0.6);
            --border-glow: rgba(0, 210, 255, 0.25);
            --text-primary: #e0e6ed;
            --text-secondary: #8a99ad;
            --accent-cyan: #00d2ff;
            --accent-gold: #ffd700;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --accent-purple: #9b59b6;
            --accent-blue: #3498db;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 10px;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
        }

        .dashboard {
            background: var(--bg-panel);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            flex-shrink: 0;
        }

        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            color: var(--text-secondary);
        }

        .status-badge {
            color: #00ff88;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff88;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { box-shadow: 0 0 8px #00ff88; }
            50% { box-shadow: 0 0 16px #00ff88, 0 0 24px #00ff88; }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 8px;
            transition: all 0.3s ease;
        }

        .stat-label {
            font-size: 10px;
            color: #6b7c93;
            text-transform: uppercase;
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
        }

        .val-gold { color: var(--accent-gold); }
        .val-pop { color: var(--accent-green); }
        .val-tech { color: var(--accent-blue); }
        .val-era { color: var(--accent-purple); }

        #map-container {
            flex: 1;
            background: #04060d;
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            min-height: 0;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .map-overlay-info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(8, 12, 22, 0.85);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            border: 1px solid rgba(0, 210, 255, 0.3);
            pointer-events: none;
            color: var(--accent-cyan);
            z-index: 10;
        }

        .event-panel {
            background: rgba(12, 17, 29, 0.95);
            border: 1px solid #00ff88;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 10px;
            color: #00ff88;
            max-height: 50px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .log-container {
            height: 80px;
            background: rgba(12, 17, 29, 0.95);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 10px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            flex-shrink: 0;
        }

        .log-title {
            font-size: 11px;
            color: #6b7c93;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .log-entry {
            margin-bottom: 3px;
            color: #a0aec0;
            line-height: 1.3;
        }

        .log-entry:last-child {
            color: var(--accent-cyan);
        }

        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .stat-value { font-size: 12px; }
            body { padding: 8px; gap: 8px; }
            .log-container { height: 60px; }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="dash-header">
            <span>SOVEREIGN AI ENGINE</span>
            <div class="status-badge"><div class="status-dot"></div> 24/7 AUTONOMOUS</div>
        </div>
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-label">DAY</div><div class="stat-value" id="stat-day">-</div></div>
            <div class="stat-card"><div class="stat-label">ERA</div><div class="stat-value val-era" id="stat-era">-</div></div>
            <div class="stat-card"><div class="stat-label">POPULATION</div><div class="stat-value val-pop" id="stat-pop">-</div></div>
            <div class="stat-card"><div class="stat-label">TREASURY</div><div class="stat-value val-gold" id="stat-gold">-</div></div>
            <div class="stat-card"><div class="stat-label">TECH</div><div class="stat-value val-tech" id="stat-tech">-</div></div>
            <div class="stat-card"><div class="stat-label">DEFENSES</div><div class="stat-value" id="stat-tanks">-</div></div>
            <div class="stat-card"><div class="stat-label">STATUS</div><div class="stat-value" id="stat-status">-</div></div>
            <div class="stat-card"><div class="stat-label">BUILDINGS</div><div class="stat-value" id="stat-building-count">-</div></div>
        </div>
    </div>

    <div id="map-container">
        <div class="map-overlay-info">Drag to Pan | Scroll or Pinch to Zoom</div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <div class="event-panel" id="event-panel">No active events</div>

    <div class="log-container">
        <div class="log-title">SYSTEM EVENT STREAM</div>
        <div id="log-stream">Connecting...</div>
    </div>

    <script>
    (() => {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        let worldState = null;
        let ws = null;
        let buildings = [];
        let units = [];
        let frameCount = 0;

        const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
        const px = (percent, dimension) => (percent / 100) * dimension;

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(protocol + '//' + window.location.host);

            ws.onopen = () => {
                console.log('✅ WebSocket connected');
                document.getElementById('log-stream').innerHTML = '<div style="color:#00ff88;">✅ Connected - waiting for data...</div>';
            };

            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'WORLD_UPDATE') {
                        worldState = msg.data;
                        updateUI();
                        generateObjects();
                        document.getElementById('log-stream').innerHTML = '<div style="color:#00ff88;">✅ Data received</div>';
                    }
                } catch (e) {
                    console.error('Parse error:', e);
                }
            };

            ws.onerror = () => {
                document.getElementById('log-stream').innerHTML = '<div style="color:#ff4444;">❌ Connection error</div>';
            };

            ws.onclose = () => {
                document.getElementById('log-stream').innerHTML = '<div style="color:#ffcc00;">🔄 Reconnecting...</div>';
                setTimeout(connectWebSocket, 2000);
            };
        }

        function updateUI() {
            if (!worldState) return;
            document.getElementById('stat-day').innerText = worldState.day;
            document.getElementById('stat-era').innerText = worldState.era;
            document.getElementById('stat-pop').innerText = worldState.population;
            document.getElementById('stat-gold').innerText = Math.floor(worldState.treasury).toLocaleString() + ' G';
            document.getElementById('stat-tech').innerText = Number(worldState.techPower).toFixed(1);
            document.getElementById('stat-tanks').innerText = worldState.tanks;
            document.getElementById('stat-status').innerText = worldState.inWar ? 'WAR' : 'PEACE';
            document.getElementById('stat-status').style.color = worldState.inWar ? '#e74c3c' : '#2ecc71';
            document.getElementById('stat-building-count').innerText = Math.floor(worldState.population / 5) + 2;

            const ep = document.getElementById('event-panel');
            if (worldState.activeEvents && worldState.activeEvents.length > 0) {
                ep.innerHTML = worldState.activeEvents.map(e => '⚡ ' + e.description).join('<br>');
                ep.style.borderColor = '#ff4444';
                ep.style.color = '#ff6666';
            } else {
                ep.innerHTML = 'No active events';
                ep.style.borderColor = '#00ff88';
                ep.style.color = '#00ff88';
            }

            const logBox = document.getElementById('log-stream');
            if (worldState.logs && worldState.logs.length > 0) {
                logBox.innerHTML = worldState.logs.map(l => '<div class="log-entry">' + l + '</div>').join('');
                logBox.scrollTop = logBox.scrollHeight;
            }
        }

        function generateObjects() {
            if (!worldState) return;
            buildings = [];
            units = [];
            const bCount = clamp(Math.floor(worldState.population / 5) + 2, 5, 80);
            const uCount = clamp(Math.floor(worldState.population / 10) + 2, 3, 50);
            for (let i = 0; i < bCount; i++) {
                buildings.push({
                    xPercent: 5 + ((i * 7) % 90),
                    yPercent: 10 + ((i * 5) % 80),
                    type: i % 4,
                    heightPercent: 5 + (i % 5) * 2
                });
            }
            for (let u = 0; u < uCount; u++) {
                units.push({
                    xPercent: 5 + Math.random() * 90,
                    yPercent: 10 + Math.random() * 80,
                    targetXPercent: 5 + Math.random() * 90,
                    targetYPercent: 10 + Math.random() * 80,
                    speed: 0.3 + Math.random() * 0.7,
                    color: ['#ff6666', '#6666ff', '#66ff66', '#ffff66', '#ff66ff'][u % 5]
                });
            }
        }

        function resizeCanvas() {
            const container = document.getElementById('map-container');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }

        window.addEventListener('resize', () => setTimeout(resizeCanvas, 150));
        resizeCanvas();

        function render() {
            frameCount++;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Terrain
            for (let x = 0; x < canvas.width; x += 12) {
                for (let y = 0; y < canvas.height; y += 12) {
                    ctx.fillStyle = ((x + y) % 24 === 0) ? '#2a3a1a' : '#1a2a1a';
                    ctx.fillRect(x, y, 12, 12);
                }
            }

            // Water
            for (let y = 0; y < canvas.height; y += 3) {
                const waveOffset = Math.sin((y * 0.05) + (frameCount * 0.03)) * 6;
                ctx.fillStyle = '#1a3a5a';
                ctx.fillRect(Math.round(canvas.width * 0.35 + waveOffset), y, 12, 3);
            }

            // Buildings
            buildings.forEach(b => {
                const bx = px(b.xPercent, canvas.width);
                const by = px(b.yPercent, canvas.height);
                const bh = px(b.heightPercent, canvas.height);
                ctx.fillStyle = ['#8a8a8a', '#c4a060', '#6a6a6a', '#7a7a7a'][b.type];
                ctx.fillRect(Math.round(bx - 6), Math.round(by - bh), 12, bh);
                ctx.fillStyle = '#ffff88';
                ctx.fillRect(Math.round(bx - 2), Math.round(by - bh + 4), 4, 4);
            });

            // Units
            units.forEach(u => {
                const ux = px(u.xPercent, canvas.width);
                const uy = px(u.yPercent, canvas.height);
                const legOffset = Math.sin(frameCount * 0.1 + ux) > 0 ? 0 : 3;
                ctx.fillStyle = u.color;
                ctx.fillRect(Math.round(ux), Math.round(uy - 6), 3, 6);
                ctx.fillStyle = '#ffcc99';
                ctx.fillRect(Math.round(ux), Math.round(uy - 9), 3, 3);
            });

            requestAnimationFrame(render);
        }

        // Start
        connectWebSocket();
        requestAnimationFrame(render);
    })();
    </script>
</body>
</html>
