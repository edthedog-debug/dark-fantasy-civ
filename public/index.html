<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sovereign AI Engine - World Map</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Dashboard de Métricas */
        .dashboard {
            background-color: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 12px 20px;
        }

        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: #8b949e;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #2ecc71;
            border-radius: 50%;
            box-shadow: 0 0 8px #2ecc71;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
        }

        .stat-card {
            background-color: #0d1117;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #21262d;
            text-align: center;
        }

        .stat-label {
            font-size: 0.65rem;
            color: #8b949e;
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: #f0f6fc;
        }

        /* Contenedor del Mapa Canvas */
        #map-container {
            flex: 1;
            position: relative;
            background-color: #05070a;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Paneles Inferiores de Eventos y Logs */
        .event-panel {
            background-color: #161b22;
            border-top: 1px solid #30363d;
            padding: 8px 15px;
            font-size: 0.85rem;
            color: #e6edf3;
            text-align: center;
        }

        .log-container {
            background-color: #0d1117;
            border-top: 1px solid #21262d;
            padding: 10px 15px;
            font-family: monospace;
            font-size: 0.8rem;
            max-height: 80px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="dash-header">
            <span style="color:#8a99ad; font-weight:bold;">SOVEREIGN AI ENGINE</span>
            <div class="status-badge">
                <div class="status-dot" id="connection-dot"></div> 
                <span id="connection-text">24/7 AUTONOMOUS</span>
            </div>
        </div>
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-label">DAY</div><div class="stat-value" id="stat-day">-</div></div>
            <div class="stat-card"><div class="stat-label">ERA</div><div class="stat-value" id="stat-era" style="color:#9b59b6;">-</div></div>
            <div class="stat-card"><div class="stat-label">POPULATION</div><div class="stat-value" id="stat-pop" style="color:#2ecc71;">-</div></div>
            <div class="stat-card"><div class="stat-label">TREASURY</div><div class="stat-value" id="stat-gold" style="color:#ffd700;">-</div></div>
            <div class="stat-card"><div class="stat-label">TECH</div><div class="stat-value" id="stat-tech" style="color:#3498db;">-</div></div>
            <div class="stat-card"><div class="stat-label">DEFENSES</div><div class="stat-value" id="stat-tanks">-</div></div>
            <div class="stat-card"><div class="stat-label">STATUS</div><div class="stat-value" id="stat-status" style="color:#2ecc71;">-</div></div>
            <div class="stat-card"><div class="stat-label">BUILDINGS</div><div class="stat-value" id="stat-building-count">-</div></div>
        </div>
    </div>

    <div id="map-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div class="event-panel" id="event-panel">No active events</div>

    <div class="log-container">
        <div id="log-stream" style="color:#6b7c93;">Connecting to server...</div>
    </div>

    <script>
        // Configuración de resolución dinámica del Canvas
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Conexión por WebSockets con protocolo flexible (HTTP/WS o HTTPS/WSS)
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}`;
        let ws;

        function connect() {
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                document.getElementById('log-stream').innerText = 'Connected to AI Sovereign Neural Link.';
                document.getElementById('log-stream').style.color = '#2ecc71';
                document.getElementById('connection-dot').style.backgroundColor = '#2ecc71';
                document.getElementById('connection-dot').style.boxShadow = '0 0 8px #2ecc71';
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);

                    // Renderizado de métricas en la interfaz
                    if (data.day !== undefined) document.getElementById('stat-day').innerText = data.day;
                    if (data.era !== undefined) document.getElementById('stat-era').innerText = data.era;
                    if (data.population !== undefined) document.getElementById('stat-pop').innerText = data.population;
                    if (data.treasury !== undefined) document.getElementById('stat-gold').innerText = `${data.treasury} G`;
                    if (data.techPower !== undefined) document.getElementById('stat-tech').innerText = data.techPower;
                    if (data.defenses !== undefined) document.getElementById('stat-tanks').innerText = data.defenses;
                    if (data.status !== undefined) document.getElementById('stat-status').innerText = data.status;
                    
                    if (data.buildings !== undefined) {
                        const count = Array.isArray(data.buildings) ? data.buildings.length : data.buildings;
                        document.getElementById('stat-building-count').innerText = count;
                    }

                    if (data.event) {
                        document.getElementById('event-panel').innerText = data.event;
                    }

                    if (data.log) {
                        document.getElementById('log-stream').innerText = data.log;
                    }

                    // Redibujado opcional en Canvas si el servidor manda entidades o matriz de mapa
                    if (data.entities && Array.isArray(data.entities)) {
                        drawMap(data.entities);
                    }
                } catch (e) {
                    console.error('Error parsing incoming WebSocket message:', e);
                }
            };

            ws.onclose = () => {
                document.getElementById('log-stream').innerText = 'Connection lost. Reconnecting...';
                document.getElementById('log-stream').style.color = '#e74c3c';
                document.getElementById('connection-dot').style.backgroundColor = '#e74c3c';
                document.getElementById('connection-dot').style.boxShadow = 'none';
                
                // Reconexión automática tras 3 segundos
                setTimeout(connect, 3000);
            };

            ws.onerror = (err) => {
                console.error('WebSocket Error:', err);
                ws.close();
            };
        }

        // Función básica para dibujar entidades en el canvas cuando se reciben datos
        function drawMap(entities) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#1e293b';
            
            entities.forEach(entity => {
                ctx.beginPath();
                ctx.arc(entity.x || 100, entity.y || 100, entity.size || 5, 0, Math.PI * 2);
                ctx.fillStyle = entity.color || '#3498db';
                ctx.fill();
            });
        }

        connect();
    </script>
</body>
</html>
