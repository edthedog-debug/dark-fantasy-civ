<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Fantasy Realm</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  overflow: hidden;
  cursor: none;
  font-family: 'Georgia', serif;
}
#gameCanvas {
  display: block;
  position: absolute;
  top: 0; left: 0;
}
#uiCanvas {
  position: absolute;
  top: 0; left: 0;
  pointer-events: none;
}
#effectCanvas {
  position: absolute;
  top: 0; left: 0;
  pointer-events: none;
}
#hud {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 10;
}
#tooltip {
  position: absolute;
  background: rgba(10,5,2,0.92);
  border: 1px solid #8b6914;
  border-radius: 4px;
  padding: 8px 12px;
  color: #d4a843;
  font-size: 13px;
  pointer-events: none;
  display: none;
  z-index: 20;
  max-width: 220px;
  box-shadow: 0 0 15px rgba(139,105,20,0.3);
}
#minimap {
  position: absolute;
  bottom: 20px;
  right: 20px;
  width: 160px;
  height: 160px;
  border: 2px solid #5a3a1a;
  border-radius: 4px;
  z-index: 15;
  background: rgba(0,0,0,0.6);
}
#inventory {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(10,5,2,0.95);
  border: 2px solid #8b6914;
  border-radius: 8px;
  padding: 30px;
  display: none;
  z-index: 25;
  min-width: 400px;
  box-shadow: 0 0 40px rgba(0,0,0,0.8), inset 0 0 30px rgba(139,105,20,0.1);
}
#inventory h2 {
  color: #d4a843;
  text-align: center;
  margin-bottom: 20px;
  font-size: 22px;
  text-shadow: 0 0 10px rgba(212,168,67,0.5);
  letter-spacing: 3px;
}
#inventory .slots {
  display: grid;
  grid-template-columns: repeat(5, 60px);
  gap: 8px;
  justify-content: center;
}
#inventory .slot {
  width: 60px;
  height: 60px;
  background: rgba(30,20,10,0.8);
  border: 1px solid #5a3a1a;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  transition: all 0.2s;
  pointer-events: auto;
  cursor: pointer;
}
#inventory .slot:hover {
  border-color: #8b6914;
  background: rgba(60,40,20,0.8);
  box-shadow: 0 0 10px rgba(139,105,20,0.3);
}
#inventory .slot.active {
  border-color: #d4a843;
  box-shadow: 0 0 15px rgba(212,168,67,0.4);
}
#dialogBox {
  position: absolute;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(10,5,2,0.92);
  border: 2px solid #5a3a1a;
  border-radius: 8px;
  padding: 20px 30px;
  color: #c8b88a;
  font-size: 16px;
  display: none;
  z-index: 20;
  max-width: 600px;
  text-align: center;
  box-shadow: 0 0 30px rgba(0,0,0,0.7);
}
#dialogBox .speaker {
  color: #d4a843;
  font-size: 14px;
  margin-bottom: 8px;
  letter-spacing: 2px;
}
#skillBar {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 6px;
  z-index: 15;
}
.skill-slot {
  width: 52px;
  height: 52px;
  background: rgba(15,10,5,0.85);
  border: 2px solid #5a3a1a;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  position: relative;
  transition: all 0.15s;
}
.skill-slot .key {
  position: absolute;
  top: -10px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  color: #8b7355;
  font-family: monospace;
}
.skill-slot .cooldown-overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  background: rgba(0,0,0,0.7);
  border-radius: 0 0 4px 4px;
  transition: height 0.1s;
}
.skill-slot.ready {
  border-color: #8b6914;
  box-shadow: 0 0 8px rgba(139,105,20,0.3);
}
.skill-slot.on-cooldown {
  opacity: 0.6;
  border-color: #3a2a1a;
}
#notification {
  position: absolute;
  top: 60px;
  left: 50%;
  transform: translateX(-50%);
  color: #d4a843;
  font-size: 16px;
  z-index: 20;
  text-shadow: 0 0 10px rgba(212,168,67,0.5);
  opacity: 0;
  transition: opacity 0.3s;
  letter-spacing: 1px;
}
#deathScreen {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(20,0,0,0.85);
  display: none;
  z-index: 30;
</script>
</body>
</html>
