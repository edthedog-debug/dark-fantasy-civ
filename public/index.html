            left: 0;
            right: 0;

        .dashboard {

        }

        .dash-header {

            align-items: center;
            margin-bottom: 8px;

        .status-badge {
            color: #00ff88;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 5px #00ff88; }
            50% { box-shadow: 0 0 15px #00ff88; }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .stat-card {
            background: rgba(25, 33, 52, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            padding: 6px 8px;
        }

        .stat-label {
            font-size: 8px;
            color: #6b7c93;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 13px;
            font-weight: bold;
            color: #fff;
        }

        #map-container {
            flex: 1;
            background: #04060d;
            border: 1px solid rgba(0, 210, 255, 0.25);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            min-height: 0;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .event-panel {
            background: rgba(12, 17, 29, 0.95);
            border: 1px solid #00ff88;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 10px;
            color: #00ff88;
            max-height: 40px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .log-container {
            height: 100px;
            background: rgba(12, 17, 29, 0.98);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 8px;
            padding: 8px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            flex-shrink: 0;
        }

        .log-entry {
            color: #a0aec0;
            margin-bottom: 2px;
            line-height: 1.4;
        }

        .log-entry:last-child {
            color: #00d2ff;
        }

        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 4px; }
            .stat-value { font-size: 11px; }
            .log-container { height: 70px; }
            body { padding: 6px; gap: 6px; }
        }
    </style>
</head>
