<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sovereign AI Engine - World Map</title>
    <style>
        :root {
            --bg-primary: #070913;
            --bg-panel: rgba(16, 22, 36, 0.95);
            --bg-card: rgba(25, 33, 52, 0.7);
            --border-glow: rgba(0, 210, 255, 0.25);
            --text-primary: #e0e6ed;
            --accent-gold: #ffd700;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --accent-cyan: #00d2ff;
            --accent-purple: #9b59b6;
            --accent-blue: #3498db;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #070913 !important;
            color: #e0e6ed;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 8px;
            overflow: hidden !important;
            position: fixed !important;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
        }

        .dashboard {
            background: rgba(16, 22, 36, 0.95);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 10px;
            padding: 10px;
            flex-shrink: 0;
        }

        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .status-badge {
            color: #00ff88;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 5px #00ff88; }
            50% { box-shadow: 0 0 15px #00ff88; }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .stat-card {
            background: rgba(25, 33, 52, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            padding: 6px 8px;
        }

        .stat-label {
            font-size: 8px;
            color: #6b7c93;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 13px;
            font-weight: bold;
            color: #fff;
        }

        #map-container {
            flex: 1;
            background: #04060d;
            border: 1px solid rgba(0, 210, 255, 0.25);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            min-height: 0;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .event-panel {
            background: rgba(12, 17, 29, 0.95);
            border: 1px solid #00ff88;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 10px;
            color: #00ff88;
            max-height: 40px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .log-container {
            height: 100px;
            background: rgba(12, 17, 29, 0.98);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 8px;
            padding: 8px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            flex-shrink: 0;
        }

        .log-entry {
            color: #a0aec0;
            margin-bottom: 2px;
            line-height: 1.4;
        }

        .log-entry:last-child {
            color: #00d2ff;
        }

        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 4px; }
            .stat-value { font-size: 11px; }
            .log-container { height: 70px; }
            body { padding: 6px; gap: 6px; }
        }
    </style>
</head>

        <div class="dash-header">
            <span style="color:#8a99ad;font-weight:bold;">SOVEREIGN AI ENGINE</span>
            <div class="status-badge">
                <div class="status-dot" id="connection-dot"></div>
                <span id="connection-text">CONNECTING...</span>

   ---------------------------------------------- */
function resizeCanvas() {
  width  = canvas.clientWidth;
  height = canvas.clientHeight;
  canvas.width  = width;
  canvas.height = height;
  if (hasOffscreen) {
    offscreen.width  = width;
    offscreen.height = height;
  }
}
window.addEventListener('resize', resizeCanvas);
