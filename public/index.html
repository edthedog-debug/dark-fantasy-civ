<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sovereign AI Engine - World Map</title>
    <style>
        :root {
            --bg-primary: #070913;
            --bg-panel: rgba(16, 22, 36, 0.9);
            --bg-card: rgba(25, 33, 52, 0.6);
            --border-glow: rgba(0, 210, 255, 0.25);
            --text-primary: #e0e6ed;
            --text-secondary: #8a99ad;
            --accent-cyan: #00d2ff;
            --accent-gold: #ffd700;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --accent-purple: #9b59b6;
            --accent-blue: #3498db;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 10px;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
        }

        .dashboard {
            background: var(--bg-panel);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), inset 0 0 30px rgba(0, 210, 255, 0.05);
            flex-shrink: 0;
        }

        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            color: var(--text-secondary);
        }

        .status-badge {
            color: #00ff88;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff88;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { box-shadow: 0 0 8px #00ff88; }
            50% { box-shadow: 0 0 16px #00ff88, 0 0 24px #00ff88; }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 8px;
            transition: all 0.3s ease;
            cursor: default;
        }

        .stat-card:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
            transform: translateY(-2px);
        }

        .stat-label {
            font-size: 10px;
            color: #6b7c93;
            text-transform: uppercase;
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
        }

        .val-gold { color: var(--accent-gold); text-shadow: 0 0 8px rgba(255, 215, 0, 0.4); }
        .val-pop { color: var(--accent-green); text-shadow: 0 0 8px rgba(46, 204, 113, 0.4); }
        .val-tech { color: var(--accent-blue); text-shadow: 0 0 8px rgba(52, 152, 219, 0.4); }
        .val-era { color: var(--accent-purple); text-shadow: 0 0 8px rgba(155, 89, 182, 0.4); }

        #map-container {
            flex: 1;
            background: #04060d;
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 210, 255, 0.1);
            min-height: 0;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .map-overlay-info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(8, 12, 22, 0.85);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            border: 1px solid rgba(0, 210, 255, 0.3);
            pointer-events: none;
            color: var(--accent-cyan);
            z-index: 10;
            backdrop-filter: blur(4px);
        }

        .log-container {
            height: 100px;
            background: rgba(12, 17, 29, 0.95);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 10px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            flex-shrink: 0;
        }

        .log-container::-webkit-scrollbar {
            width: 6px;
        }

        .log-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 3px;
        }

        .log-container::-webkit-scrollbar-thumb {
            background: rgba(0, 210, 255, 0.3);
            border-radius: 3px;
        }

        .log-title {
            font-size: 11px;
            color: #6b7c93;
            margin-bottom: 6px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .log-entry {
            margin-bottom: 3px;
            color: #a0aec0;
            line-height: 1.3;
        }

        .log-entry:last-child {
            color: var(--accent-cyan);
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.3);
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .stat-value {
                font-size: 12px;
            }
            body {
                padding: 8px;
                gap: 8px;
            }
            .log-container {
                height: 70px;
            }
            .map-overlay-info {
                font-size: 9px;
                padding: 4px 8px;
            }
        }

        @media (max-width: 400px) {
            .stat-value {
                font-size: 10px;
            }
            .stat-label {
                font-size: 8px;
            }
            .dash-header {
                font-size: 11px;
            }
            .stats-grid {
                gap: 4px;
            }
            .stat-card {
                padding: 5px;
            }
            .log-container {
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <!-- TOP DASHBOARD -->
    <div class="dashboard">
        <div class="dash-header">
            <span>SOVEREIGN AI ENGINE</span>
            <div class="status-badge"><div class="status-dot"></div> 24/7 AUTONOMOUS</div>
        </div>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">DAY</div>
                <div class="stat-value" id="stat-day">1</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">ERA</div>
                <div class="stat-value val-era" id="stat-era">Era 1</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">POPULATION</div>
                <div class="stat-value val-pop" id="stat-pop">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">TREASURY</div>
                <div class="stat-value val-gold" id="stat-gold">0 G</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">TECH POWER</div>
                <div class="stat-value val-tech" id="stat-tech">0.0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">DEFENSES</div>
                <div class="stat-value" id="stat-tanks">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">STATUS</div>
                <div class="stat-value" style="color: #2ecc71;" id="stat-status">PEACE</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">BUILD</div>
                <div class="stat-value" id="stat-build" style="font-size: 10px;">v2.0</div>
            </div>
        </div>
    </div>

    <!-- MAP CONTAINER -->
    <div id="map-container">
        <div class="map-overlay-info">Drag to Pan | Scroll or Pinch to Zoom</div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- SYSTEM EVENT LOGS STREAM -->
    <div class="log-container">
        <div class="log-title">SYSTEM EVENT STREAM</div>
        <div id="log-stream">Connecting to AI Sovereign Neural Link...</div>
    </div>

    <script>
        // ============================================
        // UNIFIED GAME ENGINE - SINGLE RENDER LOOP
        // FIXED: no duplicates on rotate, all objects clamped
        // ============================================
        
        // WebSocket setup
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);

        let worldState = {
            day: 1, era: "Era 1", population: 10, treasury: 500,
            techPower: 1, tanks: 0, logs: [], inWar: false
        };

        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            if (msg.type === 'WORLD_UPDATE') {
                worldState = msg.data;
                updateUI();
                // Regenerate objects when world state changes significantly
                generateBuildingsAndUnits();
            }
        };

        ws.onerror = () => {
            document.getElementById('log-stream').innerHTML = '<div class="log-entry" style="color:#e74c3c;">Connection lost - retrying...</div>';
        };

        function updateUI() {
            document.getElementById('stat-day').innerText = worldState.day;
            document.getElementById('stat-era').innerText = worldState.era;
            document.getElementById('stat-pop').innerText = worldState.population;
            document.getElementById('stat-gold').innerText = worldState.treasury.toLocaleString() + ' G';
            document.getElementById('stat-tech').innerText = Number(worldState.techPower).toFixed(2);
            document.getElementById('stat-tanks').innerText = worldState.tanks;
            document.getElementById('stat-status').innerText = worldState.inWar ? 'WAR' : 'PEACE';
            document.getElementById('stat-status').style.color = worldState.inWar ? '#e74c3c' : '#2ecc71';
            document.getElementById('stat-build').innerText = worldState.engineBuild || 'v2.0';

            const logBox = document.getElementById('log-stream');
            if (worldState.logs && worldState.logs.length > 0) {
                logBox.innerHTML = worldState.logs.map(l => `<div class="log-entry">${l}</div>`).join('');
                logBox.scrollTop = logBox.scrollHeight;
            }
        }

        // ============================================
        // PIXEL ART MAP ENGINE - FULLY FIXED
        // ============================================
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        let camera = { x: 0, y: 0, zoom: 1.0 };
        let isDragging = false;
        let startX, startY;
        let frameCount = 0;
        let buildings = [];
        let units = [];
        let lastRegenerationTime = 0;

        function clampValue(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }

        function generateBuildingsAndUnits() {
            // Debounce regeneration to avoid duplicates
            const now = Date.now();
            if (now - lastRegenerationTime < 1000) return;
            lastRegenerationTime = now;
            
            // ALWAYS clear arrays first
            buildings = [];
            units = [];
            
            const buildingCount = clampValue(Math.floor(worldState.population / 5) + 2, 5, 80);
            const unitCount = clampValue(Math.floor(worldState.population / 10) + 2, 3, 50);
            
            const margin = 30;
            const maxW = Math.max(canvas.width - margin * 2, 50);
            const maxH = Math.max(canvas.height - margin * 2, 50);
            
            for (let i = 0; i < buildingCount; i++) {
                const bx = clampValue(margin + ((i * 47 + 20) % maxW), margin, canvas.width - margin);
                const by = clampValue(margin + ((i * 31 + 15) % maxH), margin, canvas.height - margin);
                buildings.push({
                    x: bx,
                    y: by,
                    type: i % 4,
                    height: clampValue(20 + (i % 5) * 8 + Math.min(30, worldState.techPower * 0.5), 15, 60)
                });
            }
            
            for (let u = 0; u < unitCount; u++) {
                units.push({
                    x: clampValue(margin + Math.random() * maxW, margin, canvas.width - margin),
                    y: clampValue(margin + Math.random() * maxH, margin, canvas.height - margin),
                    targetX: clampValue(margin + Math.random() * maxW, margin, canvas.width - margin),
                    targetY: clampValue(margin + Math.random() * maxH, margin, canvas.height - margin),
                    speed: 0.5 + Math.random() * 1.5,
                    color: ['#ff6666', '#6666ff', '#66ff66', '#ffff66', '#ff66ff'][u % 5]
                });
            }
        }

        function resizeCanvas() {
            const container = document.getElementById('map-container');
            const newWidth = Math.floor(container.clientWidth);
            const newHeight = Math.floor(container.clientHeight);
            
            if (newWidth > 0 && newHeight > 0) {
                canvas.width = newWidth;
                canvas.height = newHeight;
                generateBuildingsAndUnits();
            }
        }

        // Debounced resize
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(resizeCanvas, 200);
        });
        
        // Also handle orientation change
        window.addEventListener('orientationchange', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(resizeCanvas, 300);
        });
        
        // Initial setup
        setTimeout(resizeCanvas, 50);

        // Mouse controls
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - camera.x;
            startY = e.clientY - camera.y;
        });
        window.addEventListener('mouseup', () => isDragging = false);
        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                camera.x = e.clientX - startX;
                camera.y = e.clientY - startY;
            }
        });
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
            camera.zoom = clampValue(camera.zoom * zoomFactor, 0.5, 2.5);
        }, { passive: false });

        // Touch controls
        let lastTouchDistance = 0;
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX - camera.x;
                startY = e.touches[0].clientY - camera.y;
            } else if (e.touches.length === 2) {
                isDragging = false;
                lastTouchDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        });
        canvas.addEventListener('touchend', () => isDragging = false);
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length === 1 && isDragging) {
                camera.x = e.touches[0].clientX - startX;
                camera.y = e.touches[0].clientY - startY;
            } else if (e.touches.length === 2) {
                const dist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const zoomFactor = dist / lastTouchDistance;
                camera.zoom = clampValue(camera.zoom * zoomFactor, 0.5, 2.5);
                lastTouchDistance = dist;
            }
        }, { passive: false });

        // Pixel drawing functions
        function drawPixelCastle(x, y, h) {
            ctx.fillStyle = '#8a8a8a';
            ctx.fillRect(Math.round(x - 6), Math.round(y - h), 12, h);
            for (let i = -6; i < 6; i += 3) {
                ctx.fillRect(Math.round(x + i), Math.round(y - h - 4), 3, 4);
            }
            ctx.fillStyle = '#ffff88';
            for (let w = 0; w < Math.floor(h / 10); w++) {
                ctx.fillRect(Math.round(x - 2), Math.round(y - h + 4 + w * 10), 4, 4);
            }
            ctx.fillStyle = '#3a1a0a';
            ctx.fillRect(Math.round(x - 3), Math.round(y - 6), 6, 6);
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(Math.round(x + 6), Math.round(y - h - 8), 5, 3);
        }

        function drawPixelHouse(x, y, h) {
            ctx.fillStyle = '#c4a060';
            ctx.fillRect(Math.round(x - 8), Math.round(y - h), 16, h);
            ctx.fillStyle = '#8a3a1a';
            ctx.fillRect(Math.round(x - 10), Math.round(y - h - 3), 20, 3);
            ctx.fillRect(Math.round(x - 6), Math.round(y - h - 6), 12, 3);
            ctx.fillStyle = '#ffff88';
            ctx.fillRect(Math.round(x - 4), Math.round(y - h + 4), 3, 3);
            ctx.fillRect(Math.round(x + 1), Math.round(y - h + 4), 3, 3);
            ctx.fillStyle = '#3a1a0a';
            ctx.fillRect(Math.round(x - 2), Math.round(y - 4), 4, 4);
        }

        function drawPixelBarracks(x, y, h) {
            ctx.fillStyle = '#6a6a6a';
            ctx.fillRect(Math.round(x - 10), Math.round(y - h), 20, h);
            ctx.fillStyle = '#4a4a4a';
            ctx.fillRect(Math.round(x - 12), Math.round(y - h - 2), 24, 2);
            ctx.fillStyle = '#c0c0c0';
            ctx.fillRect(Math.round(x - 1), Math.round(y - h + 2), 2, h - 4);
            ctx.fillRect(Math.round(x - 3), Math.round(y - h + 2), 6, 2);
        }

        function drawPixelTower(x, y, h) {
            ctx.fillStyle = '#7a7a7a';
            ctx.fillRect(Math.round(x - 4), Math.round(y - h), 8, h);
            ctx.fillStyle = '#5a5a5a';
            ctx.fillRect(Math.round(x - 6), Math.round(y - h - 2), 12, 2);
        }

        function drawPixelTree(x, y) {
            ctx.fillStyle = '#5a3a1a';
            ctx.fillRect(Math.round(x), Math.round(y), 3, 9);
            ctx.fillStyle = '#1a5a1a';
            ctx.fillRect(Math.round(x - 6), Math.round(y - 9), 15, 9);
            ctx.fillStyle = '#2a6a2a';
            ctx.fillRect(Math.round(x - 3), Math.round(y - 12), 9, 3);
        }

        function drawPixelUnit(unit) {
            const legOffset = Math.sin(frameCount * 0.1 + unit.x) > 0 ? 0 : 3;
            ctx.fillStyle = unit.color;
            ctx.fillRect(Math.round(unit.x), Math.round(unit.y - 6), 3, 6);
            ctx.fillStyle = '#ffcc99';
            ctx.fillRect(Math.round(unit.x), Math.round(unit.y - 9), 3, 3);
            ctx.fillStyle = '#333';
            ctx.fillRect(Math.round(unit.x), Math.round(unit.y), 1, 3 + legOffset);
            ctx.fillRect(Math.round(unit.x + 2), Math.round(unit.y), 1, 3 - legOffset);
        }

        function drawPixelGoldMine(x, y) {
            ctx.fillStyle = '#555555';
            ctx.fillRect(Math.round(x - 6), Math.round(y - 4), 12, 8);
            ctx.fillStyle = '#ffd700';
            ctx.fillRect(Math.round(x - 4), Math.round(y - 6), 3, 3);
            ctx.fillRect(Math.round(x), Math.round(y - 6), 3, 3);
            ctx.fillRect(Math.round(x - 2), Math.round(y - 8), 3, 2);
        }

        function updateUnits() {
            const margin = 15;
            const maxW = canvas.width - margin;
            const maxH = canvas.height - margin;
            
            units.forEach(unit => {
                const dx = unit.targetX - unit.x;
                const dy = unit.targetY - unit.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 5) {
                    unit.targetX = clampValue(margin + Math.random() * (maxW - margin), margin, maxW);
                    unit.targetY = clampValue(margin + Math.random() * (maxH - margin), margin, maxH);
                } else {
                    unit.x += (dx / dist) * unit.speed;
                    unit.y += (dy / dist) * unit.speed;
                }
                
                // Hard clamp to canvas bounds
                unit.x = clampValue(unit.x, margin, maxW);
                unit.y = clampValue(unit.y, margin, maxH);
            });
        }

        // Main render loop
        function render() {
            frameCount++;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(camera.x, camera.y);
            ctx.scale(camera.zoom, camera.zoom);

            // Terrain
            const tileSize = 12;
            const startX = Math.floor(-camera.x / tileSize) - 1;
            const endX = Math.ceil((canvas.width - camera.x) / tileSize) + 1;
            const startY = Math.floor(-camera.y / tileSize) - 1;
            const endY = Math.ceil((canvas.height - camera.y) / tileSize) + 1;
            
            for (let x = startX; x < endX; x++) {
                for (let y = startY; y < endY; y++) {
                    ctx.fillStyle = ((x + y) % 2 === 0) ? '#2a3a1a' : '#1a2a1a';
                    ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
                }
            }

            // Water river (animated)
            const riverX = canvas.width * 0.35;
            for (let y = -10; y < canvas.height + 10; y += 3) {
                const waveOffset = Math.sin((y * 0.05) + (frameCount * 0.03)) * 6;
                ctx.fillStyle = '#1a3a5a';
                ctx.fillRect(Math.round(riverX + waveOffset), y, 12, 3);
            }

            // Trees - dynamic positions based on canvas
            const treePositions = [];
            const treeCount = 9;
            for (let i = 0; i < treeCount; i++) {
                treePositions.push({
                    x: clampValue((i * 97 + 50) % Math.max(canvas.width - 40, 100), 30, canvas.width - 30),
                    y: clampValue((i * 67 + 40) % Math.max(canvas.height - 40, 100), 30, canvas.height - 30)
                });
            }
            treePositions.forEach(t => drawPixelTree(t.x, t.y));

            // Gold mines - dynamic positions
            const goldPositions = [];
            const goldCount = clampValue(Math.floor(worldState.techPower / 5) + 3, 3, 10);
            for (let g = 0; g < goldCount; g++) {
                goldPositions.push({
                    x: clampValue((g * 89 + 30) % Math.max(canvas.width - 40, 100), 30, canvas.width - 30),
                    y: clampValue((g * 73 + 60) % Math.max(canvas.height - 40, 100), 30, canvas.height - 30)
                });
            }
            goldPositions.forEach(g => drawPixelGoldMine(g.x, g.y));

            // Buildings - from worldState, already clamped
            buildings.forEach(building => {
                switch(building.type) {
                    case 0: drawPixelCastle(building.x, building.y, building.height); break;
                    case 1: drawPixelHouse(building.x, building.y, building.height * 0.6); break;
                    case 2: drawPixelBarracks(building.x, building.y, building.height * 0.7); break;
                    case 3: drawPixelTower(building.x, building.y, building.height * 1.2); break;
                }
            });

            // Units - already clamped
            updateUnits();
            units.forEach(unit => drawPixelUnit(unit));

            ctx.restore();
            requestAnimationFrame(render);
        }

        requestAnimationFrame(render);
    </script>
</body>
</html>
