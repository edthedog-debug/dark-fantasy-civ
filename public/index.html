<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous AI Cloud World Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; background: #020204; color: #f1f5f9; font-family: monospace; overflow: hidden; }
        #canvas-container { position: relative; width: 100vw; height: 100vh; }
        #hud { position: absolute; top: 15px; left: 15px; background: rgba(10, 11, 18, 0.92); border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 8px; padding: 16px; width: 380px; z-index: 10; }
        .hud-header { font-size: 0.9rem; color: #38bdf8; font-weight: bold; margin-bottom: 8px; border-bottom: 1px solid rgba(56, 189, 248, 0.2); padding-bottom: 4px; display: flex; justify-content: space-between; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 0.75rem; }
        .stat-val { font-weight: bold; color: #fbbf24; }
        #thought-log { position: absolute; bottom: 15px; left: 15px; right: 15px; height: 140px; background: rgba(10, 11, 18, 0.94); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 8px; padding: 12px; overflow-y: auto; font-size: 0.75rem; color: #c084fc; z-index: 10; }
        .log-entry { margin-bottom: 4px; }
    </style>
</head>
<body>

<div id="canvas-container">
    <div id="hud">
        <div class="hud-header">
            <span>CLOUD STREAM 24/7</span>
            <span id="conn-status" style="color: #f43f5e;">[DISCONNECTED]</span>
        </div>
        <div class="stat-grid">
            <div>Day: <span id="day-val" class="stat-val">0</span></div>
            <div>Era: <span id="era-val" class="stat-val" style="color:#c084fc;">-</span></div>
            <div>Ruler: <span id="ruler-val" class="stat-val">-</span></div>
            <div>Pop: <span id="pop-val" class="stat-val">0</span></div>
            <div>Tanks: <span id="tanks-val" class="stat-val" style="color:#f43f5e;">0</span></div>
            <div>Gold: <span id="gold-val" class="stat-val">0</span></div>
            <div>Build: <span id="build-val" class="stat-val" style="color:#38bdf8;">-</span></div>
            <div>War Status: <span id="war-val" class="stat-val" style="color:#4ade80;">PEACE</span></div>
        </div>
    </div>
    <div id="thought-log"></div>
</div>

<script>
    // AUTO-CONNECT TO BACKEND SERVER WEBSOCKET
    const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
    const wsUrl = protocol + window.location.host;
    let socket = new WebSocket(wsUrl);

    const statusEl = document.getElementById('conn-status');

    socket.onopen = () => {
        statusEl.innerText = "[CONNECTED 24/7]";
        statusEl.style.color = "#4ade80";
    };

    socket.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === 'WORLD_UPDATE') {
            const data = msg.data;
            document.getElementById('day-val').innerText = data.day;
            document.getElementById('era-val').innerText = data.era;
            document.getElementById('ruler-val').innerText = data.ruler;
            document.getElementById('pop-val').innerText = data.population;
            document.getElementById('tanks-val').innerText = data.tanks;
            document.getElementById('gold-val').innerText = data.treasury;
            document.getElementById('build-val').innerText = data.engineBuild;
            document.getElementById('war-val').innerText = data.inWar ? "IN WAR" : "PEACE";
            document.getElementById('war-val').style.color = data.inWar ? "#f43f5e" : "#4ade80";

            // Update Logs
            const logBox = document.getElementById('thought-log');
            logBox.innerHTML = data.logs.map(l => `<div class="log-entry">${l}</div>`).join('');
            logBox.scrollTop = logBox.scrollHeight;
        }
    };

    socket.onclose = () => {
        statusEl.innerText = "[RECONNECTING...]";
        statusEl.style.color = "#fbbf24";
    };
</script>
</body>
</html>
