<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Autonomous Sci-Fi Civilization</title>
    <!-- Load Pixi.js for Isometric Rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #02040a;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #f1f5f9;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            touch-action: none; /* Pointer dragging only for game canvas */
        }

        /* Glassmorphism Sci-Fi Panels */
        .ui-panel {
            position: absolute;
            z-index: 10;
            background: rgba(8, 12, 22, 0.82);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 12px;
            padding: 14px;
            color: #e2e8f0;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6), inset 0 0 1px 1px rgba(255, 255, 255, 0.05);
        }

        /* Top HUD Display */
        #hud {
            top: 12px;
            left: 12px;
            right: 12px;
            max-width: 600px;
            margin: 0 auto;
        }
        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .status-live {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #38bdf8;
        }
        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .hud-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        @media (max-width: 480px) {
            .hud-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        .hud-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 6px 8px;
            border-radius: 6px;
        }
        .hud-label {
            font-size: 10px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .val {
            font-size: 13px;
            font-weight: 700;
            margin-top: 2px;
        }
        .c-purple { color: #c084fc; }
        .c-gold { color: #facc15; }
        .c-cyan { color: #38bdf8; }
        .c-green { color: #4ade80; }
        .c-red { color: #f87171; }

        /* Scrollable Log Terminal */
        #log-box {
            bottom: 12px;
            left: 12px;
            right: 12px;
            max-width: 600px;
            margin: 0 auto;
            height: 120px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .log-title {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #64748b;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        #log-content {
            flex: 1;
            overflow-y: auto;
            touch-action: pan-y; /* Enable smooth scrolling on touch devices */
            padding-right: 6px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            line-height: 1.5;
        }
        #log-content::-webkit-scrollbar {
            width: 4px;
        }
        #log-content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
        #log-content::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.4);
            border-radius: 4px;
        }
        .log-entry {
            margin-bottom: 3px;
            color: #cbd5e1;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- UPPER HUD DISPLAY -->
    <div id="hud" class="ui-panel">
        <div class="hud-header">
            <span>SOVEREIGN AI ENGINE</span>
            <span class="status-live"><div class="pulse-dot"></div> 24/7 AUTONOMOUS</span>
        </div>
        <div class="hud-grid">
            <div class="hud-card">
                <div class="hud-label">Day</div>
                <div id="val-day" class="val c-gold">1</div>
            </div>
            <div class="hud-card">
                <div class="hud-label">Era</div>
                <div id="val-era" class="val c-purple">Tribal</div>
            </div>
            <div class="hud-card">
                <div class="hud-label">Population</div>
                <div id="val-pop" class="val c-green">0</div>
            </div>
            <div class="hud-card">
                <div class="hud-label">Treasury</div>
                <div id="val-gold" class="val c-gold">0 G</div>
            </div>
            <div class="hud-card">
                <div class="hud-label">Tech Power</div>
                <div id="val-tech" class="val c-cyan">0.5</div>
            </div>
            <div class="hud-card">
                <div class="hud-label">Defenses</div>
                <div id="val-tanks" class="val">0</div>
            </div>
            <div class="hud-card">
                <div class="hud-label">Status</div>
                <div id="val-war" class="val c-green">PEACE</div>
            </div>
            <div class="hud-card">
                <div class="hud-label">Build</div>
                <div id="val-build" class="val c-cyan">v2.0</div>
            </div>
        </div>
    </div>

    <!-- LOWER LOG CONSOLE -->
    <div id="log-box" class="ui-panel">
        <div class="log-title">System Event Stream</div>
        <div id="log-content"></div>
    </div>

    <script>
        // ==========================================
        // 1. PIXI.JS GRAPHICS & CAMERA ENGINE
        // ==========================================
        const container = document.getElementById('canvas-container');
        const app = new PIXI.Application({
            width: window.innerWidth,
            height: window.innerHeight,
            backgroundColor: 0x02040a,
            resizeTo: window,
            antialias: true,
            resolution: window.devicePixelRatio || 1
        });
        container.appendChild(app.view);

        // World Camera Container
        const worldContainer = new PIXI.Container();
        worldContainer.x = app.screen.width / 2;
        worldContainer.y = app.screen.height / 3;
        app.stage.addChild(worldContainer);

        // Layers for Isometric Depth
        const mapLayer = new PIXI.Container();
        const gridOverlayLayer = new PIXI.Container();
        const entitiesLayer = new PIXI.Container();
        worldContainer.addChild(mapLayer);
        worldContainer.addChild(gridOverlayLayer);
        worldContainer.addChild(entitiesLayer);

        // Interactive Pan & Zoom
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };

        app.stage.eventMode = 'static';
        app.stage.hitArea = app.screen;

        app.stage.on('pointerdown', (e) => {
            isDragging = true;
            dragStart = { x: e.global.x - worldContainer.x, y: e.global.y - worldContainer.y };
        });
        app.stage.on('pointermove', (e) => {
            if (isDragging) {
                worldContainer.x = e.global.x - dragStart.x;
                worldContainer.y = e.global.y - dragStart.y;
            }
        });
        app.stage.on('pointerup', () => isDragging = false);
        app.stage.on('pointerupoutside', () => isDragging = false);

        // Mouse Wheel Zoom
        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
            const newScale = Math.min(Math.max(0.4, worldContainer.scale.x * zoomFactor), 2.5);
            worldContainer.scale.set(newScale);
        }, { passive: false });

        // ==========================================
        // 2. ISOMETRIC MAP & BIOME GENERATOR
        // ==========================================
        const GRID_SIZE = 22;
        const TILE_WIDTH = 52;
        const TILE_HEIGHT = 26;

        const BIOMES = {
            0: { name: "Plains", color: 0x0f291e, border: 0x144531 },
            1: { name: "Plasma Water", color: 0x0284c7, border: 0x0369a1 },
            2: { name: "Mountains", color: 0x334155, border: 0x475569 },
            3: { name: "Bio-Forest", color: 0x065f46, border: 0x047857 }
        };

        const mapData = [];
        for (let x = 0; x < GRID_SIZE; x++) {
            mapData[x] = [];
            for (let y = 0; y < GRID_SIZE; y++) {
                if (x === 11 || y === 11) mapData[x][y] = 1; // Center River / Cyber Canal
                else if ((x < 3 && y < 3) || (x > 18 && y > 18)) mapData[x][y] = 2; // Mountain ranges
                else if ((x + y) % 6 === 0) mapData[x][y] = 3; // Forests
                else mapData[x][y] = 0;
            }
        }

        function isoToScreen(x, y) {
            return {
                x: (x - y) * (TILE_WIDTH / 2),
                y: (x + y) * (TILE_HEIGHT / 2)
            };
        }

        function renderMap(techLevel = 1) {
            mapLayer.removeChildren();
            gridOverlayLayer.removeChildren();

            const isFuturistic = techLevel >= 3;

            for (let x = 0; x < GRID_SIZE; x++) {
                for (let y = 0; y < GRID_SIZE; y++) {
                    const biome = BIOMES[mapData[x][y]] || BIOMES[0];
                    const pos = isoToScreen(x, y);

                    const tile = new PIXI.Graphics();
                    let tileColor = biome.color;
                    let borderColor = biome.border;

                    // Adapt tile palette to Era advancement
                    if (isFuturistic && mapData[x][y] === 0) {
                        tileColor = 0x0a101d; // Dark Cyber Floor
                        borderColor = 0x1e293b;
                    }

                    tile.beginFill(tileColor, 0.9);
                    tile.lineStyle(1, borderColor, 0.6);
                    tile.moveTo(0, 0);
                    tile.lineTo(TILE_WIDTH / 2, TILE_HEIGHT / 2);
                    tile.lineTo(0, TILE_HEIGHT);
                    tile.lineTo(-TILE_WIDTH / 2, TILE_HEIGHT / 2);
                    tile.closePath();
                    tile.endFill();

                    tile.x = pos.x;
                    tile.y = pos.y;
                    mapLayer.addChild(tile);

                    // Add futuristic glowing grid overlay if tech power is high
                    if (isFuturistic && (x % 2 === 0 && y % 2 === 0)) {
                        const gridLine = new PIXI.Graphics();
                        gridLine.lineStyle(1, 0x38bdf8, 0.15);
                        gridLine.drawCircle(pos.x, pos.y + TILE_HEIGHT / 2, 2);
                        gridOverlayLayer.addChild(gridLine);
                    }
                }
            }
        }

        // ==========================================
        // 3. MULTI-ERA DRAWING HELPERS (Stone Age -> Sci-Fi)
        // AI HOOK: Extend graphic drawing functions here
        // ==========================================

        // --- ERA 1: PRIMITIVE / STONE AGE BUILDINGS ---
        function drawPrimitiveHut(x, y) {
            const container = new PIXI.Container();
            const pos = isoToScreen(x, y);
            container.x = pos.x; container.y = pos.y;
            const g = new PIXI.Graphics();

            // Straw/Wood Hut
            g.beginFill(0x78350f); g.drawCircle(0, -6, 8); g.endFill();
            g.beginFill(0xa16207); g.moveTo(-9, -6).lineTo(0, -18).lineTo(9, -6).closePath(); g.endFill();
            // Campfire
            g.beginFill(0xef4444); g.drawCircle(0, 2, 2.5); g.endFill();

            container.addChild(g);
            return container;
        }

        // --- ERA 2: MEDIEVAL / FEUDAL BUILDINGS ---
        function drawMedievalCastle(x, y) {
            const container = new PIXI.Container();
            const pos = isoToScreen(x, y);
            container.x = pos.x; container.y = pos.y;
            const g = new PIXI.Graphics();

            // Stone Walls
            g.beginFill(0x334155); g.drawRect(-12, -14, 24, 14); g.endFill();
            // Golden Spire Keep
            g.beginFill(0xd97706); g.drawRect(-6, -26, 12, 12); g.endFill();
            g.beginFill(0xef4444); g.moveTo(-8, -26).lineTo(0, -38).lineTo(8, -26).closePath(); g.endFill();

            container.addChild(g);
            return container;
        }

        // --- ERA 3: FUTURISTIC SCI-FI CITADEL ---
        function drawSciFiSpire(x, y) {
            const container = new PIXI.Container();
            const pos = isoToScreen(x, y);
            container.x = pos.x; container.y = pos.y;
            const g = new PIXI.Graphics();

            // Neon Base Ring
            g.lineStyle(1.5, 0x38bdf8, 0.8);
            g.drawEllipse(0, 0, 16, 8);
            g.lineStyle(0);

            // Metallic Tower Body
            g.beginFill(0x0f172a);
            g.moveTo(-10, 0).lineTo(-4, -45).lineTo(4, -45).lineTo(10, 0).closePath();
            g.endFill();

            // Cyan Hologram Energy Core
            g.beginFill(0x38bdf8, 0.8);
            g.drawRect(-2, -35, 4, 25);
            g.endFill();

            // Floating Apex Plasma Crystal
            g.beginFill(0xc084fc);
            g.moveTo(0, -58).lineTo(5, -50).lineTo(0, -42).lineTo(-5, -50).closePath();
            g.endFill();

            container.addChild(g);
            return container;
        }

        // --- DEFENSE UNITS (Tanks / Drones) ---
        function drawDefenseUnit(x, y, isSciFi) {
            const container = new PIXI.Container();
            const pos = isoToScreen(x, y);
            container.x = pos.x; container.y = pos.y;
            const g = new PIXI.Graphics();

            if (!isSciFi) {
                // Classic Tank
                g.beginFill(0x1e293b); g.drawRoundRect(-7, -4, 14, 8, 2); g.endFill();
                g.beginFill(0xef4444); g.drawCircle(0, -3, 3); g.endFill();
                g.lineStyle(2, 0x991b1b); g.moveTo(0, -3).lineTo(6, -6); g.lineStyle(0);
            } else {
                // Hover Drone / Mech
                g.beginFill(0x38bdf8, 0.9); g.drawCircle(0, -8, 4); g.endFill();
                g.lineStyle(1, 0xc084fc); g.drawCircle(0, -8, 7); g.lineStyle(0);
                // Thruster Glow
                g.beginFill(0x38bdf8, 0.5); g.drawEllipse(0, -2, 3, 1.5); g.endFill();
            }

            container.addChild(g);
            return container;
        }

        // ==========================================
        // 4. ERA VISUAL PROGRESSION ENGINE
        // ==========================================
        function updateEntities(state) {
            entitiesLayer.removeChildren();

            const tech = state.techPower || 0.5;
            let eraTier = 1; // 1: Stone/Primitive, 2: Medieval, 3+: Sci-Fi
            if (tech >= 1.5 && tech < 4) eraTier = 2;
            if (tech >= 4) eraTier = 3;

            // Update Map Styling based on Tech Tier
            renderMap(eraTier);

            // 1. Render Main Capital / Citadel
            let capital;
            if (eraTier === 1) capital = drawPrimitiveHut(7, 7);
            else if (eraTier === 2) capital = drawMedievalCastle(7, 7);
            else capital = drawSciFiSpire(7, 7);
            entitiesLayer.addChild(capital);

            // 2. Render Citizen Housing Slots
            const pop = state.population || 0;
            const houseSlots = [
                {x: 5, y: 8}, {x: 8, y: 5}, {x: 8, y: 8}, {x: 5, y: 5},
                {x: 4, y: 7}, {x: 7, y: 4}, {x: 9, y: 8}, {x: 8, y: 9}
            ];
            const houseCount = Math.min(Math.ceil(pop / 2), houseSlots.length);

            for (let i = 0; i < houseCount; i++) {
                const slot = houseSlots[i];
                let house;
                if (eraTier === 1) house = drawPrimitiveHut(slot.x, slot.y);
                else if (eraTier === 2) house = drawMedievalCastle(slot.x, slot.y);
                else house = drawSciFiSpire(slot.x, slot.y);
                entitiesLayer.addChild(house);
            }

            // 3. Render Defensive Military (Tanks or Cyber Drones)
            const tankCount = Math.min(state.tanks || 0, 20);
            for (let i = 0; i < tankCount; i++) {
                const tx = 3 + (i % 5) * 2;
                const ty = 12 + Math.floor(i / 5) * 2;
                const unit = drawDefenseUnit(tx, ty, eraTier >= 3);
                entitiesLayer.addChild(unit);
            }

            // Sort depth for isometric overlapping
            entitiesLayer.children.sort((a, b) => a.y - b.y);
        }

        // Ambient Sci-Fi Starfield
        const stars = [];
        for (let i = 0; i < 40; i++) {
            const s = new PIXI.Graphics();
            s.beginFill(0x38bdf8, Math.random() * 0.6 + 0.2);
            s.drawCircle(0, 0, Math.random() * 2 + 0.5);
            s.endFill();
            s.x = Math.random() * app.screen.width;
            s.y = Math.random() * app.screen.height;
            s.vy = Math.random() * -0.4 - 0.1;
            app.stage.addChild(s);
            stars.push(s);
        }

        app.ticker.add(() => {
            stars.forEach(s => {
                s.y += s.vy;
                if (s.y < 0) s.y = app.screen.height;
            });
        });

        window.addEventListener('resize', () => {
            worldContainer.x = app.screen.width / 2;
            worldContainer.y = app.screen.height / 3;
        });

        // ==========================================
        // 5. REAL-TIME WEBSOCKET SYNC
        // ==========================================
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}`;
        const socket = new WebSocket(wsUrl);

        socket.onmessage = (event) => {
            const message = JSON.parse(event.data);
            if (message.type === 'WORLD_UPDATE') {
                const data = message.data;

                // Sync HUD Stats
                document.getElementById('val-day').innerText = data.day;
                document.getElementById('val-era').innerText = data.era;
                document.getElementById('val-pop').innerText = data.population;
                document.getElementById('val-gold').innerText = `${data.treasury} G`;
                document.getElementById('val-tech').innerText = Number(data.techPower).toFixed(2);
                document.getElementById('val-tanks').innerText = data.tanks;
                document.getElementById('val-build').innerText = data.engineBuild;
                
                const warEl = document.getElementById('val-war');
                if (data.inWar) {
                    warEl.innerText = 'WAR';
                    warEl.className = 'val c-red';
                } else {
                    warEl.innerText = 'PEACE';
                    warEl.className = 'val c-green';
                }

                // Sync Event Console Logs & Smooth Auto-Scroll
                if (data.logs) {
                    const logContainer = document.getElementById('log-content');
                    logContainer.innerHTML = data.logs.map(l => `<div class="log-entry">${l}</div>`).join('');
                    logContainer.scrollTop = logContainer.scrollHeight;
                }

                // Update Visual Map Entities & Evolution Tier
                updateEntities(data);
            }
        };
    </script>
</body>
</html>
