<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sovereign AI Engine - World Map</title>
    <style>
        :root {
            --bg-primary: #070913;
            --bg-panel: rgba(16, 22, 36, 0.9);
            --bg-card: rgba(25, 33, 52, 0.6);
            --border-glow: rgba(0, 210, 255, 0.25);
            --text-primary: #e0e6ed;
            --text-secondary: #8a99ad;
            --accent-cyan: #00d2ff;
            --accent-gold: #ffd700;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --accent-purple: #9b59b6;
            --accent-blue: #3498db;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 10px;
            overflow: hidden;
        }

        .dashboard {
            background: var(--bg-panel);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), inset 0 0 30px rgba(0, 210, 255, 0.05);
        }

        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            color: var(--text-secondary);
        }

        .status-badge {
            color: #00ff88;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff88;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { box-shadow: 0 0 8px #00ff88; }
            50% { box-shadow: 0 0 16px #00ff88, 0 0 24px #00ff88; }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 8px;
            transition: all 0.3s ease;
            cursor: default;
        }

        .stat-card:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
            transform: translateY(-2px);
        }

        .stat-label {
            font-size: 10px;
            color: #6b7c93;
            text-transform: uppercase;
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
        }

        .val-gold { color: var(--accent-gold); text-shadow: 0 0 8px rgba(255, 215, 0, 0.4); }
        .val-pop { color: var(--accent-green); text-shadow: 0 0 8px rgba(46, 204, 113, 0.4); }
        .val-tech { color: var(--accent-blue); text-shadow: 0 0 8px rgba(52, 152, 219, 0.4); }
        .val-era { color: var(--accent-purple); text-shadow: 0 0 8px rgba(155, 89, 182, 0.4); }

        #map-container {
            flex: 1;
            background: #04060d;
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 210, 255, 0.1);
            min-height: 300px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .map-overlay-info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(8, 12, 22, 0.85);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            border: 1px solid rgba(0, 210, 255, 0.3);
            pointer-events: none;
            color: var(--accent-cyan);
            z-index: 10;
            backdrop-filter: blur(4px);
        }

        .log-container {
            height: 100px;
            background: rgba(12, 17, 29, 0.95);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 10px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
        }

        .log-container::-webkit-scrollbar {
            width: 6px;
        }

        .log-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 3px;
        }

        .log-container::-webkit-scrollbar-thumb {
            background: rgba(0, 210, 255, 0.3);
            border-radius: 3px;
        }

        .log-title {
            font-size: 11px;
            color: #6b7c93;
            margin-bottom: 6px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .log-entry {
            margin-bottom: 3px;
            color: #a0aec0;
            line-height: 1.3;
        }

        .log-entry:last-child {
            color: var(--accent-cyan);
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.3);
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .stat-value {
                font-size: 12px;
            }
            body {
                padding: 8px;
                gap: 8px;
            }
            .log-container {
                height: 80px;
            }
            #map-container {
                min-height: 200px;
            }
        }

        @media (max-width: 400px) {
            .stat-value {
                font-size: 10px;
            }
            .stat-label {
                font-size: 8px;
            }
            .dash-header {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <!-- TOP DASHBOARD -->
    <div class="dashboard">
        <div class="dash-header">
            <span>SOVEREIGN AI ENGINE</span>
            <div class="status-badge"><div class="status-dot"></div> 24/7 AUTONOMOUS</div>
        </div>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">DAY</div>
                <div class="stat-value" id="stat-day">1</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">ERA</div>
                <div class="stat-value val-era" id="stat-era">Era 1</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">POPULATION</div>
                <div class="stat-value val-pop" id="stat-pop">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">TREASURY</div>
                <div class="stat-value val-gold" id="stat-gold">0 G</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">TECH POWER</div>
                <div class="stat-value val-tech" id="stat-tech">0.0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">DEFENSES</div>
                <div class="stat-value" id="stat-tanks">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">STATUS</div>
                <div class="stat-value" style="color: #2ecc71;" id="stat-status">PEACE</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">BUILD</div>
                <div class="stat-value" id="stat-build" style="font-size: 10px;">v2.0</div>
            </div>
        </div>
    </div>

    <!-- MAP CONTAINER -->
    <div id="map-container">
        <div class="map-overlay-info">Drag to Pan | Scroll or Pinch to Zoom</div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- SYSTEM EVENT LOGS STREAM -->
    <div class="log-container">
        <div class="log-title">SYSTEM EVENT STREAM</div>
        <div id="log-stream">Connecting to AI Sovereign Neural Link...</div>
    </div>

    <script>
(() => {
    // ----- Canvas Setup -----
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    // ----- Configuration -----
    const TILE = 4;                     // size of one pixel block
    const FPS = 60;
    const WALK_SPEED = 0.5;             // pixels per frame
    const ANIM_STEPS = 8;               // frames per walk cycle

    // ----- Color Palette -----
    const COLORS = {
        buildingBody: '#7B9ACC',
        roof: '#5A7AA0',
        windowOn: '#FFD700',
        windowOff: '#333333',
        door: '#8B5A2B',
        unitBody: '#C46210',
        unitShade: '#8A3B00'
    };

    // ----- Utility -----
    const clamp = (val, min, max) => Math.max(min, Math.min(max, val));

    // ----- Mock Data (replace with real game data) -----
    const buildings = new Array(1132).fill().map((_, i) => ({
        x: (i * 23) % (canvas.width - 60),
        y: Math.floor(i / 20) * 40 + 20,
        w: 40,
        h: 60,
        windows: 3,
        doors: 1
    }));
    const units = new Array(566).fill().map((_, i) => ({
        x: (i * 13) % (canvas.width - 20),
        y: Math.floor(i / 30) * 30 + 100,
        dir: i % 2 === 0 ? 1 : -1,   // 1 = right, -1 = left
        walkPhase: 0
    }));

    // ----- Drawing Functions -----
    function drawBuilding(b) {
        // Clamp position
        const x = clamp(b.x, 0, canvas.width - b.w);
        const y = clamp(b.y, 0, canvas.height - b.h);

        // Body
        ctx.fillStyle = COLORS.buildingBody;
        ctx.fillRect(x, y, b.w, b.h);

        // Roof (simple triangle using blocks)
        ctx.fillStyle = COLORS.roof;
        const roofHeight = Math.floor(b.w / 2);
        for (let i = 0; i < roofHeight; i++) {
            const w = b.w - i * 2;
            ctx.fillRect(x + i, y - i - 1, w, 1);
        }

        // Windows (grid)
        const winW = Math.floor(b.w / (b.windows + 1));
        const winH = Math.floor(b.h / (b.windows + 1));
        ctx.fillStyle = COLORS.windowOn;
        for (let i = 1; i <= b.windows; i++) {
            const wx = x + i * winW - Math.floor(winW / 2);
            const wy = y + i * winH - Math.floor(winH / 2);
            ctx.fillRect(wx, wy, Math.max(2, Math.floor(winW / 3)), Math.max(2, Math.floor(winH / 3)));
        }

        // Door
        const doorW = Math.max(4, Math.floor(b.w * 0.2));
        const doorH = Math.max(8, Math.floor(b.h * 0.25));
        const dx = x + Math.floor((b.w - doorW) / 2);
        const dy = y + b.h - doorH;
        ctx.fillStyle = COLORS.door;
        ctx.fillRect(dx, dy, doorW, doorH);
    }

    function drawUnit(u, frame) {
        // Update walking phase
        u.walkPhase = (u.walkPhase + 1) % ANIM_STEPS;
        const offset = Math.sin((u.walkPhase / ANIM_STEPS) * Math.PI * 2) * 1.5;

        // Position with walking offset
        const x = clamp(u.x + offset * u.dir, 0, canvas.width - 12);
        const y = clamp(u.y, 0, canvas.height - 20);

        // Body
        ctx.fillStyle = COLORS.unitBody;
        ctx.fillRect(x, y - 12, 12, 12); // head
        ctx.fillRect(x, y, 12, 12);     // torso

        // Shade for leg animation
        ctx.fillStyle = COLORS.unitShade;
        const legOffset = (u.walkPhase < ANIM_STEPS / 2) ? 1 : -1;
        ctx.fillRect(x + 2, y + 12 + legOffset, 3, 4); // left leg
        ctx.fillRect(x + 7, y + 12 - legOffset, 3, 4); // right leg
    }

    // ----- Main Render Loop -----
    let lastTime = 0;
    function render(time) {
        const delta = time - lastTime;
        if (delta >= 1000 / FPS) {
            // Clear
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Buildings
            for (const b of buildings) drawBuilding(b);

            // Draw Units with simple walking animation
            for (const u of units) {
                // Move unit
                u.x += WALK_SPEED * u.dir;
                if (u.x < 0 || u.x > canvas.width - 12) u.dir *= -1; // bounce
                drawUnit(u, Math.floor(time / (1000 / FPS)));
            }

            lastTime = time;
        }
        requestAnimationFrame(render);
    }

    // ----- Start -----
    requestAnimationFrame(render);
})();
</script>
</body>
</html>
