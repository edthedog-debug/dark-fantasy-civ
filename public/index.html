        :root {
            --bg-primary: #070913;

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 10px;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
        }

        .dashboard {
            background: var(--bg-panel);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            flex-shrink: 0;
        }

        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            color: var(--text-secondary);
        }

        .status-badge {
            color: #00ff88;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff88;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { box-shadow: 0 0 8px #00ff88; }
            50% { box-shadow: 0 0 16px #00ff88, 0 0 24px #00ff88; }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 8px;
            transition: all 0.3s ease;
        }

        .stat-label {
            font-size: 10px;
            color: #6b7c93;
            text-transform: uppercase;
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
        }

        .val-gold { color: var(--accent-gold); }
        .val-pop { color: var(--accent-green); }
        .val-tech { color: var(--accent-blue); }
        .val-era { color: var(--accent-purple); }

        #map-container {
            flex: 1;
            background: #04060d;
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            min-height: 0;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .map-overlay-info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(8, 12, 22, 0.85);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            border: 1px solid rgba(0, 210, 255, 0.3);
            pointer-events: none;
            color: var(--accent-cyan);
            z-index: 10;
        }

        .event-panel {
            background: rgba(12, 17, 29, 0.95);
            border: 1px solid #00ff88;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 10px;
            color: #00ff88;
            max-height: 50px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .log-container {
            height: 80px;
            background: rgba(12, 17, 29, 0.95);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 10px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            flex-shrink: 0;
        }

        .log-container::-webkit-scrollbar {
            width: 6px;
        }

        .log-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }

        .log-container::-webkit-scrollbar-thumb {
            background: rgba(0, 210, 255, 0.3);
        }

        .log-title {
            font-size: 11px;
            color: #6b7c93;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .log-entry {
            margin-bottom: 3px;
            color: #a0aec0;
            line-height: 1.3;
        }

        .log-entry:last-child {
            color: var(--accent-cyan);
        }

        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .stat-value { font-size: 12px; }
            body { padding: 8px; gap: 8px; }
            .log-container { height: 60px; }
        }

        @media (max-width: 400px) {
            .stat-value { font-size: 10px; }
            .stat-label { font-size: 8px; }
        }
    </style>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Civilization Simulator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;overflow:hidden;font-family:'Segoe UI',sans-serif}
canvas{display:block}

<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H;function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}
resize();addEventListener('resize',resize);

/* ─── Game State ─── */
const game={day:30750,pop:5666,tech:3130.79,resource:1240,happiness:72.3};
const tiles=[],cities=[],particles=[],stars=[],tradeRoutes=[];
const TILE=48,COLS=Math.ceil(W/TILE)+2,ROWS=Math.ceil(H/TILE)+2;

/* ─── Noise helpers ─── */
function hash(x,y){let n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)}
function smoothNoise(x,y){
  const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;
  const sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
  const a=hash(ix,iy),b=hash(ix+1,iy),c=hash(ix,iy+1),d=hash(ix+1,iy+1);
  return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy;
}
function fbm(x,y,oct=5){let v=0,a=1,f=1,t=0;for(let i=0;i<oct;i++){v+=smoothNoise(x*f,y*f)*a;t+=a;a*=.5;f*=2}return v/t}

/* ─── Initialize World ─── */
function initWorld(){
  tiles.length=0;
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const e=fbm(x*.08,y*.08,6),m=fbm(x*.04+50,y*.04+50,4);
    let type,color;
    if(e<.28){type='deep';color='#0a2a4a'}
    else if(e<.35){type='water';color='#1565a0'}
    else if(e<.38){type='shore';color='#c2b280'}
    else if(e<.55){type='grass';color='#3a7a3a'}
    else if(e<.7){type='forest';color='#1a5a1a'}
    else if(e<.82){type='mountain';color='#6a6a5a'}
    else{type='snow';color='#d8d8e8'}
    if(e>.38&&m<.25){type='desert';color='#b8a060'}
    tiles.push({x,y,type,e,m,color});
  }
  cities.length=0;
  for(let i=0;i<18;i++){
    let tx,ty,att=0;
    do{tx=Math.floor(Math.random()*COLS);ty=Math.floor(Math.random()*ROWS);att++}
    while(tiles[ty*COLS+tx]?.type==='water'&&att<200);
    if(att<200)cities.push({x:tx*TILE+TILE/2,y:ty*TILE+TILE/2,r:3+Math.random()*5,pop:Math.floor(100+Math.random()*800),pulse:Math.random()*Math.PI*2});
  }
  stars.length=0;
  for(let i=0;i<200;i++)stars.push({x:Math.random()*W,y:Math.random()*H*.35,s:Math.random()*1.8+.2,tw:Math.random()*Math.PI*2,sp:Math.random()*2+1});
  for(let i=0;i<cities.length-1;i++)if(Math.random()>.3)tradeRoutes.push([cities[i],cities[i+1]]);
}
initWorld();

/* ─── Particle System ─── */
function spawnParticle(x,y,color){
  particles.push({x,y,vx:(Math.random()-.5)*2,vy:-Math.random()*2-1,life:1,color,r:Math.random()*2+1});
}
function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.02;p.life-=.012;
    if(p.life<=0)particles.splice(i,1);
  }
  while(particles.length>300)particles.shift();
}

/* ─── Time ─── */
let t=0,dt=0,lastT=performance.now();
function frame(now){
  dt=Math.min((now-lastT)/1000,.05);lastT=now;t+=dt;
  resize();
  render();updateParticles();
  requestAnimationFrame(frame);
}

function render(){
  // Sky gradient
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#050510');sky.addColorStop(.3,'#0a1628');sky.addColorStop(.6,'#1a2a4a');sky.addColorStop(1,'#0a1a2a');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  // Stars
  for(const s of stars){
    const alpha=.4+.6*Math.sin(t*s.sp+s.tw);
    ctx.beginPath();ctx.arc(s.x,s.y,s.s,0,Math.PI*2);
    ctx.fillStyle=`rgba(200,220,255,${alpha})`;ctx.fill();
  }

  // Tiles
  const camX=0,camY=H*.15;
  for(const tile of tiles){
    const px=tile.x*TILE+camX,py=tile.y*TILE+camY;
    if(px<-TILE||px>W+TILE||py<-TILE||py>H+TILE)continue;
    ctx.fillStyle=tile.color;
    ctx.fillRect(px,py,TILE-1,TILE-1);
    // Subtle lighting
    const light=.85+.15*Math.sin(tile.x*.5+t*.3);
    ctx.fillStyle=`rgba(255,255,255,${(light-1)*.12})`;
    ctx.fillRect(px,py,TILE-1,TILE-1);
    // Water shimmer
    if(tile.type==='water'||tile.type==='deep'){
      const wave=Math.sin(tile.x*.3+t*1.5+tile.y*.2)*.08;
      ctx.fillStyle=`rgba(100,180,255,${.1+wave})`;

  ctx.strokeStyle=hudGlow;ctx.lineWidth=2;ctx.stroke();

  ctx.font='bold 13px "Segoe UI",sans-serif';ctx.textBaseline='top';
  const lines=[
    {label:'DAY',value:String(game.day),color:'#60aaff'},
    {label:'POP',value:String(game.pop),color:'#60ff90'},
    {label:'TECH',value=game.tech.toFixed(2),color:'#ffcc40'},

  ];
  for(let i=0;i<lines.length;i++){
    const ly=py+20+i*34;
    // Label
    ctx.fillStyle='rgba(140,170,220,.6)';ctx.font='bold 9px "Segoe UI",sans-serif';

    // Mini bar
    const barX=px+panelW-80,barW=60;
    ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(barX,ly+18,barW,5);
    const maxVal=i===0?99999:i===1?20000:i===2?5000:i===3?5000:100;

  ctx.beginPath();roundRect(ctx,mmX,mmY,mmW,mmH,8);
  ctx.fillStyle='rgba(8,12,28,.75)';ctx.fill();
  ctx.strokeStyle='rgba(100,160,255,.2)';ctx.lineWidth=1;ctx.stroke();
  // Draw tile dots on minimap
  const sx=mmW/COLS,sy=mmH/ROWS;
  for(let i=0;i<tiles.length;i+=3){
    const t=tiles[i];
    ctx.fillStyle=t.color;

  ctx.fillStyle='rgba(8,12,28,.7)';ctx.fillRect(0,barY,W,barH);
  ctx.strokeStyle='rgba(100,160,255,.15)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,barY);ctx.lineTo(W,barY);ctx.stroke();

  const techProg=(game.tech%100)/100;
