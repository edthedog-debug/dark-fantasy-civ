<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sovereign AI Engine - World Map</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #070913;
            color: #e0e6ed;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 10px;
            overflow: hidden;
        }

        /* Top Stats Dashboard */
        .dashboard {
            background: rgba(16, 22, 36, 0.9);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #8a99ad;
        }
        .status-badge {
            color: #00ff88;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff88;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .stat-card {
            background: rgba(25, 33, 52, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 8px;
        }
        .stat-label { font-size: 10px; color: #6b7c93; text-transform: uppercase; margin-bottom: 2px; }
        .stat-value { font-size: 14px; font-weight: bold; color: #ffffff; }
        .val-gold { color: #f1c40f; }
        .val-pop { color: #2ecc71; }
        .val-tech { color: #3498db; }
        .val-era { color: #9b59b6; }

        /* Middle Map Container */
        #map-container {
            flex: 1;
            background: #04060d;
            border: 1px solid rgba(0, 210, 255, 0.25);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        .map-overlay-info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(8, 12, 22, 0.85);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            border: 1px solid rgba(0, 210, 255, 0.3);
            pointer-events: none;
            color: #00d2ff;
        }

        /* Bottom Event Logs Stream */
        .log-container {
            height: 100px;
            background: rgba(12, 17, 29, 0.95);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 12px;
            padding: 10px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
        }
        .log-title {
            font-size: 11px;
            color: #6b7c93;
            margin-bottom: 6px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .log-entry { margin-bottom: 3px; color: #a0aec0; line-height: 1.3; }
        .log-entry:last-child { color: #00d2ff; }

        @media (max-width: 600px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .stat-value { font-size: 12px; }
        }
    </style>
</head>
<body>

    <!-- TOP DASHBOARD -->
    <div class="dashboard">
        <div class="dash-header">
            <span>SOVEREIGN AI ENGINE</span>
            <div class="status-badge"><div class="status-dot"></div> 24/7 AUTONOMOUS</div>
        </div>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">DAY</div>
                <div class="stat-value" id="stat-day">1</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">ERA</div>
                <div class="stat-value val-era" id="stat-era">Era 1</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">POPULATION</div>
                <div class="stat-value val-pop" id="stat-pop">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">TREASURY</div>
                <div class="stat-value val-gold" id="stat-gold">0 G</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">TECH POWER</div>
                <div class="stat-value val-tech" id="stat-tech">0.0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">DEFENSES</div>
                <div class="stat-value" id="stat-tanks">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">STATUS</div>
                <div class="stat-value" style="color: #2ecc71;" id="stat-status">PEACE</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">BUILD</div>
                <div class="stat-value" id="stat-build" style="font-size: 10px;">v2.0</div>
            </div>
        </div>
    </div>

    <!-- MAP CONTAINER -->
    <div id="map-container">
        <div class="map-overlay-info">💡 Drag to Pan | Scroll or Pinch to Zoom</div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- SYSTEM EVENT LOGS STREAM -->
    <div class="log-container">
        <div class="log-title">SYSTEM EVENT STREAM</div>
        <div id="log-stream">Connecting to AI Sovereign Neural Link...</div>
    </div>

    <script>
        // WebSocket setup
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);

        let worldState = {
            day: 1, era: "Era 1", population: 10, treasury: 500,
            techPower: 1, tanks: 0, logs: [], inWar: false
        };

        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            if (msg.type === 'WORLD_UPDATE') {
                worldState = msg.data;
                updateUI();
            }
        };

        function updateUI() {
            document.getElementById('stat-day').innerText = worldState.day;
            document.getElementById('stat-era').innerText = worldState.era;
            document.getElementById('stat-pop').innerText = worldState.population;
            document.getElementById('stat-gold').innerText = worldState.treasury.toLocaleString() + ' G';
            document.getElementById('stat-tech').innerText = Number(worldState.techPower).toFixed(2);
            document.getElementById('stat-tanks').innerText = worldState.tanks;
            document.getElementById('stat-status').innerText = worldState.inWar ? 'WAR' : 'PEACE';
            document.getElementById('stat-status').style.color = worldState.inWar ? '#e74c3c' : '#2ecc71';
            document.getElementById('stat-build').innerText = worldState.engineBuild || 'v2.0';

            // Logs stream update
            const logBox = document.getElementById('log-stream');
            if (worldState.logs && worldState.logs.length > 0) {
                logBox.innerHTML = worldState.logs.map(l => `<div class="log-entry">${l}</div>`).join('');
                logBox.scrollTop = logBox.scrollHeight;
            }
        }

        // --- ISOMETRIC GRAPHICS ENGINE (CANVAS 2D) ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let camera = { x: 0, y: 0, zoom: 1.0 };
        let isDragging = false;
        let startX, startY;

        function resizeCanvas() {
            const container = document.getElementById('map-container');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Mouse controls: Pan & Zoom
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - camera.x;
            startY = e.clientY - camera.y;
        });
        window.addEventListener('mouseup', () => isDragging = false);
        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                camera.x = e.clientX - startX;
                camera.y = e.clientY - startY;
            }
        });
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
            camera.zoom = Math.min(Math.max(0.5, camera.zoom * zoomFactor), 2.5);
        }, { passive: false });

        // Touch controls for mobile devices
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX - camera.x;
                startY = e.touches[0].clientY - camera.y;
            }
        });
        canvas.addEventListener('touchend', () => isDragging = false);
        canvas.addEventListener('touchmove', (e) => {
            if (isDragging && e.touches.length === 1) {
                camera.x = e.touches[0].clientX - startX;
                camera.y = e.touches[0].clientY - startY;
            }
        });

        // Isometric conversion helpers
        function toIso(x, y) {
            const isoX = (x - y) * 32;
            const isoY = (x + y) * 16;
            return { x: isoX, y: isoY };
        }

        let frameCount = 0;

        function render() {
            frameCount++;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width / 2 + camera.x, canvas.height / 3 + camera.y);
            ctx.scale(camera.zoom, camera.zoom);

            const gridSize = 14;

            // 1. Draw Grid Terrain Tiles
            for (let x = 0; x < gridSize; x++) {
                for (let y = 0; y < gridSize; y++) {
                    const pos = toIso(x, y);
                    
                    ctx.beginPath();
                    ctx.moveTo(pos.x, pos.y);
                    ctx.lineTo(pos.x + 32, pos.y + 16);
                    ctx.lineTo(pos.x, pos.y + 32);
                    ctx.lineTo(pos.x - 32, pos.y + 16);
                    ctx.closePath();

                    // River running through tile 6
                    if (x === 6) {
                        ctx.fillStyle = '#1e3799';
                    } else {
                        ctx.fillStyle = ((x + y) % 2 === 0) ? '#0f2027' : '#203a43';
                    }
                    ctx.fill();
                    ctx.strokeStyle = '#112233';
                    ctx.lineWidth = 0.5;
                    ctx.stroke();
                }
            }

            // 2. Render Buildings based on Population & Tech Power
            const buildingCount = Math.min(25, Math.floor(worldState.population / 2) + 2);
            for (let i = 0; i < buildingCount; i++) {
                const gx = (i * 3) % gridSize;
                const gy = Math.floor((i * 3) / gridSize) * 2 % gridSize;
                if (gx === 6) continue; // Don't build in river

                const pos = toIso(gx, gy);
                const height = 20 + (i % 3) * 15 + Math.min(40, worldState.techPower * 2);

                // Front Face
                ctx.fillStyle = '#00d2ff';
                ctx.beginPath();
                ctx.moveTo(pos.x - 12, pos.y + 10);
                ctx.lineTo(pos.x, pos.y + 16);
                ctx.lineTo(pos.x, pos.y + 16 - height);
                ctx.lineTo(pos.x - 12, pos.y + 10 - height);
                ctx.closePath();
                ctx.fill();

                // Side Face
                ctx.fillStyle = '#0083b0';
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y + 16);
                ctx.lineTo(pos.x + 12, pos.y + 10);
                ctx.lineTo(pos.x + 12, pos.y + 10 - height);
                ctx.lineTo(pos.x, pos.y + 16 - height);
                ctx.closePath();
                ctx.fill();

                // Roof
                ctx.fillStyle = '#80d0c7';
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y + 16 - height);
                ctx.lineTo(pos.x + 12, pos.y + 10 - height);
                ctx.lineTo(pos.x, pos.y + 4 - height);
                ctx.lineTo(pos.x - 12, pos.y + 10 - height);
                ctx.closePath();
                ctx.fill();
            }

            // 3. Render Citizens (Moving Glowing Particles)
            const citizenDots = Math.min(30, worldState.population);
            for (let c = 0; c < citizenDots; c++) {
                const speed = 0.02;
                const offset = (frameCount * speed + c * 1.5) % 10;
                const cPos = toIso(2 + (c % 4) * 2 + offset, 2 + Math.floor(c / 4) * 2);

                ctx.beginPath();
                ctx.arc(cPos.x, cPos.y + 10, 3, 0, Math.PI * 2);
                ctx.fillStyle = '#2ecc71';
                ctx.shadowColor = '#2ecc71';
                ctx.shadowBlur = 5;
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // 4. Render Defense Units / Tanks
            for (let t = 0; t < Math.min(10, worldState.tanks); t++) {
                const tPos = toIso(1, 1 + t * 1.2);
                ctx.fillStyle = '#e74c3c';
                ctx.fillRect(tPos.x - 6, tPos.y, 12, 8);
                ctx.fillStyle = '#c0392b';
                ctx.fillRect(tPos.x - 2, tPos.y - 3, 4, 4);
            }

            ctx.restore();
            requestAnimationFrame(render);
        }

        requestAnimationFrame(render);
