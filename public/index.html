<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sovereign AI Engine - World Map</title>
    <style>
        :root {
            --bg-primary: #070913;
            --bg-panel: rgba(16, 22, 36, 0.9);
            --bg-card: rgba(25, 33, 52, 0.6);
            --border-glow: rgba(0, 210, 255, 0.25);
            --text-primary: #e0e6ed;
            --text-secondary: #8a99ad;
            --accent-cyan: #00d2ff;
            --accent-gold: #ffd700;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --accent-purple: #9b59b6;
            --accent-blue: #3498db;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 10px;
            overflow: hidden;
        }

        .dashboard {
            background: var(--bg-panel);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), inset 0 0 30px rgba(0, 210, 255, 0.05);
        }

        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            color: var(--text-secondary);
        }

        .status-badge {
            color: #00ff88;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff88;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { box-shadow: 0 0 8px #00ff88; }
            50% { box-shadow: 0 0 16px #00ff88, 0 0 24px #00ff88; }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 8px;
            transition: all 0.3s ease;
            cursor: default;
        }

        .stat-card:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
            transform: translateY(-2px);
        }

        .stat-label {
            font-size: 10px;
            color: #6b7c93;
            text-transform: uppercase;
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
        }

        .val-gold { color: var(--accent-gold); text-shadow: 0 0 8px rgba(255, 215, 0, 0.4); }
        .val-pop { color: var(--accent-green); text-shadow: 0 0 8px rgba(46, 204, 113, 0.4); }
        .val-tech { color: var(--accent-blue); text-shadow: 0 0 8px rgba(52, 152, 219, 0.4); }
        .val-era { color: var(--accent-purple); text-shadow: 0 0 8px rgba(155, 89, 182, 0.4); }

        #map-container {
            flex: 1;
            background: #04060d;
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 210, 255, 0.1);
            min-height: 300px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .map-overlay-info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(8, 12, 22, 0.85);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            border: 1px solid rgba(0, 210, 255, 0.3);
            pointer-events: none;
            color: var(--accent-cyan);
            z-index: 10;
            backdrop-filter: blur(4px);
        }

        .log-container {
            height: 100px;
            background: rgba(12, 17, 29, 0.95);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 10px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
        }

        .log-container::-webkit-scrollbar {
            width: 6px;
        }

        .log-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 3px;
        }

        .log-container::-webkit-scrollbar-thumb {
            background: rgba(0, 210, 255, 0.3);
            border-radius: 3px;
        }

        .log-title {
            font-size: 11px;
            color: #6b7c93;
            margin-bottom: 6px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .log-entry {
            margin-bottom: 3px;
            color: #a0aec0;
            line-height: 1.3;
        }

        .log-entry:last-child {
            color: var(--accent-cyan);
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.3);
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .stat-value {
                font-size: 12px;
            }
            body {
                padding: 8px;
                gap: 8px;
            }
            .log-container {
                height: 80px;
            }
            #map-container {
                min-height: 200px;
            }
        }

        @media (max-width: 400px) {
            .stat-value {
                font-size: 10px;
            }
            .stat-label {
                font-size: 8px;
            }
            .dash-header {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <!-- TOP DASHBOARD -->
    <div class="dashboard">
        <div class="dash-header">
            <span>SOVEREIGN AI ENGINE</span>
            <div class="status-badge"><div class="status-dot"></div> 24/7 AUTONOMOUS</div>
        </div>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">DAY</div>
                <div class="stat-value" id="stat-day">1</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">ERA</div>
                <div class="stat-value val-era" id="stat-era">Era 1</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">POPULATION</div>
                <div class="stat-value val-pop" id="stat-pop">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">TREASURY</div>
                <div class="stat-value val-gold" id="stat-gold">0 G</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">TECH POWER</div>
                <div class="stat-value val-tech" id="stat-tech">0.0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">DEFENSES</div>
                <div class="stat-value" id="stat-tanks">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">STATUS</div>
                <div class="stat-value" style="color: #2ecc71;" id="stat-status">PEACE</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">BUILD</div>
                <div class="stat-value" id="stat-build" style="font-size: 10px;">v2.0</div>
            </div>
        </div>
    </div>

    <!-- MAP CONTAINER -->
    <div id="map-container">
        <div class="map-overlay-info">Drag to Pan | Scroll or Pinch to Zoom</div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- SYSTEM EVENT LOGS STREAM -->
    <div class="log-container">
        <div class="log-title">SYSTEM EVENT STREAM</div>
        <div id="log-stream">Connecting to AI Sovereign Neural Link...</div>
    </div>

    <script>
        // ============================================
        // UNIFIED GAME ENGINE - SINGLE RENDER LOOP
        // NO DUPLICATES, NO CONFLICTS
        // ============================================
        
        // WebSocket setup
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);

        let worldState = {
            day: 1, era: "Era 1", population: 10, treasury: 500,
            techPower: 1, tanks: 0, logs: [], inWar: false
        };

        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            if (msg.type === 'WORLD_UPDATE') {
                worldState = msg.data;
                updateUI();
            }
        };

        ws.onerror = () => {
            document.getElementById('log-stream').innerHTML = '<div class="log-entry" style="color:#e74c3c;">Connection lost - retrying...</div>';
        };

        function updateUI() {
            document.getElementById('stat-day').innerText = worldState.day;
            document.getElementById('stat-era').innerText = worldState.era;
            document.getElementById('stat-pop').innerText = worldState.population;
            document.getElementById('stat-gold').innerText = worldState.treasury.toLocaleString() + ' G';
            document.getElementById('stat-tech').innerText = Number(worldState.techPower).toFixed(2);
            document.getElementById('stat-tanks').innerText = worldState.tanks;
            document.getElementById('stat-status').innerText = worldState.inWar ? 'WAR' : 'PEACE';
            document.getElementById('stat-status').style.color = worldState.inWar ? '#e74c3c' : '#2ecc71';
            document.getElementById('stat-build').innerText = worldState.engineBuild || 'v2.0';

            const logBox = document.getElementById('log-stream');
            if (worldState.logs && worldState.logs.length > 0) {
                logBox.innerHTML = worldState.logs.map(l => `<div class="log-entry">${l}</div>`).join('');
                logBox.scrollTop = logBox.scrollHeight;
            }
        }

        // ============================================
        // PIXEL ART MAP ENGINE - SINGLE CANVAS
        // ============================================
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        let camera = { x: 0, y: 0, zoom: 1.0 };
        let isDragging = false;
        let startX, startY;
        let frameCount = 0;
        let buildings = [];
        let units = [];

        function generateBuildingsAndUnits() {
            buildings = [];
            units = [];
            
            const buildingCount = Math.min(80, Math.floor(worldState.population / 5) + 2);
            const unitCount = Math.min(50, Math.floor(worldState.population / 10) + 2);
            
            const margin = 20;
            const maxW = Math.max(canvas.width - margin * 2, 100);
            const maxH = Math.max(canvas.height - margin * 2, 100);
            
            for (let i = 0; i < buildingCount; i++) {
                buildings.push({
                    x: margin + ((i * 47 + 20) % maxW),
                    y: margin + ((i * 31 + 15) % maxH),
                    type: i % 4,
                    height: 20 + (i % 5) * 8 + Math.min(30, worldState.techPower * 0.5)
                });
            }
            
            for (let u = 0; u < unitCount; u++) {
                units.push({
                    x: margin + Math.random() * maxW,
                    y: margin + Math.random() * maxH,
                    targetX: margin + Math.random() * maxW,
                    targetY: margin + Math.random() * maxH,
                    speed: 0.5 + Math.random() * 1.5,
                    color: ['#ff6666', '#6666ff', '#66ff66', '#ffff66', '#ff66ff'][u % 5]
                });
            }
        }

        function resizeCanvas() {
            const container = document.getElementById('map-container');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            generateBuildingsAndUnits();
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Mouse controls
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - camera.x;
            startY = e.clientY - camera.y;
        });
        window.addEventListener('mouseup', () => isDragging = false);
        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                camera.x = e.clientX - startX;
                camera.y = e.clientY - startY;
            }
        });
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
            camera.zoom = Math.min(Math.max(0.5, camera.zoom * zoomFactor), 2.5);
        }, { passive: false });

        // Touch controls
        let lastTouchDistance = 0;
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX - camera.x;
                startY = e.touches[0].clientY - camera.y;
            } else if (e.touches.length === 2) {
                isDragging = false;
                lastTouchDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        });
        canvas.addEventListener('touchend', () => isDragging = false);
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length === 1 && isDragging) {
                camera.x = e.touches[0].clientX - startX;
                camera.y = e.touches[0].clientY - startY;
            } else if (e.touches.length === 2) {
                const dist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const zoomFactor = dist / lastTouchDistance;
                camera.zoom = Math.min(Math.max(0.5, camera.zoom * zoomFactor), 2.5);
                lastTouchDistance = dist;
            }
        }, { passive: false });

        // Pixel drawing functions
        function drawPixelCastle(x, y, h) {
            ctx.fillStyle = '#8a8a8a';
            ctx.fillRect(x - 6, y - h, 12, h);
            for (let i = -6; i < 6; i += 3) {
                ctx.fillRect(x + i, y - h - 4, 3, 4);
            }
            ctx.fillStyle = '#ffff88';
            for (let w = 0; w < h / 10; w++) {
                ctx.fillRect(x - 2, y - h + 4 + w * 10, 4, 4);
            }
            ctx.fillStyle = '#3a1a0a';
            ctx.fillRect(x - 3, y - 6, 6, 6);
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(x + 6, y - h - 8, 5, 3);
        }

        function drawPixelHouse(x, y, h) {
            ctx.fillStyle = '#c4a060';
            ctx.fillRect(x - 8, y - h, 16, h);
            ctx.fillStyle = '#8a3a1a';
            ctx.fillRect(x - 10, y - h - 3, 20, 3);
            ctx.fillRect(x - 6, y - h - 6, 12, 3);
            ctx.fillStyle = '#ffff88';
            ctx.fillRect(x - 4, y - h + 4, 3, 3);
            ctx.fillRect(x + 1, y - h + 4, 3, 3);
            ctx.fillStyle = '#3a1a0a';
            ctx.fillRect(x - 2, y - 4, 4, 4);
        }

        function drawPixelBarracks(x, y, h) {
            ctx.fillStyle = '#6a6a6a';
            ctx.fillRect(x - 10, y - h, 20, h);
            ctx.fillStyle = '#4a4a4a';
            ctx.fillRect(x - 12, y - h - 2, 24, 2);
            ctx.fillStyle = '#c0c0c0';
            ctx.fillRect(x - 1, y - h + 2, 2, h - 4);
            ctx.fillRect(x - 3, y - h + 2, 6, 2);
        }

        function drawPixelTower(x, y, h) {
            ctx.fillStyle = '#7a7a7a';
            ctx.fillRect(x - 4, y - h, 8, h);
            ctx.fillStyle = '#5a5a5a';
            ctx.fillRect(x - 6, y - h - 2, 12, 2);
        }

        function drawPixelTree(x, y) {
            ctx.fillStyle = '#5a3a1a';
            ctx.fillRect(x, y, 3, 9);
            ctx.fillStyle = '#1a5a1a';
            ctx.fillRect(x - 6, y - 9, 15, 9);
            ctx.fillStyle = '#2a6a2a';
            ctx.fillRect(x - 3, y - 12, 9, 3);
        }

        function drawPixelUnit(unit) {
            const legOffset = Math.sin(frameCount * 0.1 + unit.x) > 0 ? 0 : 3;
            ctx.fillStyle = unit.color;
            ctx.fillRect(Math.round(unit.x), Math.round(unit.y - 6), 3, 6);
            ctx.fillStyle = '#ffcc99';
            ctx.fillRect(Math.round(unit.x), Math.round(unit.y - 9), 3, 3);
            ctx.fillStyle = '#333';
            ctx.fillRect(Math.round(unit.x), Math.round(unit.y), 1, 3 + legOffset);
            ctx.fillRect(Math.round(unit.x + 2), Math.round(unit.y), 1, 3 - legOffset);
        }

        function drawPixelGoldMine(x, y) {
            ctx.fillStyle = '#555555';
            ctx.fillRect(x - 6, y - 4, 12, 8);
            ctx.fillStyle = '#ffd700';
            ctx.fillRect(x - 4, y - 6, 3, 3);
            ctx.fillRect(x, y - 6, 3, 3);
            ctx.fillRect(x - 2, y - 8, 3, 2);
        }

        function updateUnits() {
            const margin = 10;
            const maxW = canvas.width - margin;
            const maxH = canvas.height - margin;
            
            units.forEach(unit => {
                const dx = unit.targetX - unit.x;
                const dy = unit.targetY - unit.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 5) {
                    unit.targetX = margin + Math.random() * maxW;
                    unit.targetY = margin + Math.random() * maxH;
                } else {
                    unit.x += (dx / dist) * unit.speed;
                    unit.y += (dy / dist) * unit.speed;
                }
                
                // Clamp to canvas bounds
                unit.x = Math.max(margin, Math.min(maxW, unit.x));
                unit.y = Math.max(margin, Math.min(maxH, unit.y));
            });
        }

        // Main render loop - SINGLE LOOP ONLY
        function render() {
            frameCount++;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(camera.x, camera.y);
            ctx.scale(camera.zoom, camera.zoom);

            // Terrain
            const tileSize = 12;
            for (let x = -10; x < canvas.width / tileSize + 10; x++) {
                for (let y = -10; y < canvas.height / tileSize + 10; y++) {
                    ctx.fillStyle = ((x + y) % 2 === 0) ? '#2a3a1a' : '#1a2a1a';
                    ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
                }
            }

            // Water river (animated)
            const riverX = canvas.width * 0.35;
            for (let y = -10; y < canvas.height + 10; y += 3) {
                const waveOffset = Math.sin((y * 0.05) + (frameCount * 0.03)) * 6;
                ctx.fillStyle = '#1a3a5a';
                ctx.fillRect(riverX + waveOffset, y, 12, 3);
            }

            // Trees
            const treePositions = [
                {x: 100, y: 80}, {x: 250, y: 150}, {x: 400, y: 60},
                {x: 550, y: 200}, {x: 700, y: 100}, {x: 150, y: 300},
                {x: 350, y: 250}, {x: 600, y: 350}, {x: 750, y: 250}
            ];
            treePositions.forEach(t => drawPixelTree(t.x, t.y));

            // Gold mines
            const goldPositions = [
                {x: 200, y: 400}, {x: 500, y: 100}, {x: 650, y: 300}
            ];
            goldPositions.forEach(g => drawPixelGoldMine(g.x, g.y));

            // Buildings from worldState
            buildings.forEach(building => {
                switch(building.type) {
                    case 0: drawPixelCastle(building.x, building.y, building.height); break;
                    case 1: drawPixelHouse(building.x, building.y, building.height * 0.6); break;
                    case 2: drawPixelBarracks(building.x, building.y, building.height * 0.7); break;
                    case 3: drawPixelTower(building.x, building.y, building.height * 1.2); break;
                }
            });

            // Units walking
            updateUnits();
            units.forEach(unit => drawPixelUnit(unit));

            ctx.restore();
            requestAnimationFrame(render);
        }

        requestAnimationFrame(render);
    </script>
</body>
</html>
