<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sovereign AI Engine - World Map</title>
    <style>
        :root {
            --bg-primary: #070913;
            --bg-panel: rgba(16, 22, 36, 0.9);
            --bg-card: rgba(25, 33, 52, 0.6);
            --border-glow: rgba(0, 210, 255, 0.25);
            --text-primary: #e0e6ed;
            --text-secondary: #8a99ad;
            --accent-cyan: #00d2ff;
            --accent-gold: #ffd700;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --accent-purple: #9b59b6;
            --accent-blue: #3498db;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 10px;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
        }

        .dashboard {
            background: var(--bg-panel);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), inset 0 0 30px rgba(0, 210, 255, 0.05);
            flex-shrink: 0;
        }

        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            color: var(--text-secondary);
        }

        .status-badge {
            color: #00ff88;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff88;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { box-shadow: 0 0 8px #00ff88; }
            50% { box-shadow: 0 0 16px #00ff88, 0 0 24px #00ff88; }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 8px;
            transition: all 0.3s ease;
            cursor: default;
        }

        .stat-card:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
            transform: translateY(-2px);
        }

        .stat-label {
            font-size: 10px;
            color: #6b7c93;
            text-transform: uppercase;
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
        }

        .val-gold { color: var(--accent-gold); text-shadow: 0 0 8px rgba(255, 215, 0, 0.4); }
        .val-pop { color: var(--accent-green); text-shadow: 0 0 8px rgba(46, 204, 113, 0.4); }
        .val-tech { color: var(--accent-blue); text-shadow: 0 0 8px rgba(52, 152, 219, 0.4); }
        .val-era { color: var(--accent-purple); text-shadow: 0 0 8px rgba(155, 89, 182, 0.4); }

        #map-container {
            flex: 1;
            background: #04060d;
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 210, 255, 0.1);
            min-height: 0;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .map-overlay-info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(8, 12, 22, 0.85);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            border: 1px solid rgba(0, 210, 255, 0.3);
            pointer-events: none;
            color: var(--accent-cyan);
            z-index: 10;
            backdrop-filter: blur(4px);
        }

        .log-container {
            height: 100px;
            background: rgba(12, 17, 29, 0.95);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 10px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            flex-shrink: 0;
        }

        .log-container::-webkit-scrollbar {
            width: 6px;
        }

        .log-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 3px;
        }

        .log-container::-webkit-scrollbar-thumb {
            background: rgba(0, 210, 255, 0.3);
            border-radius: 3px;
        }

        .log-title {
            font-size: 11px;
            color: #6b7c93;
            margin-bottom: 6px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .log-entry {
            margin-bottom: 3px;
            color: #a0aec0;
            line-height: 1.3;
        }

        .log-entry:last-child {
            color: var(--accent-cyan);
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.3);
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .stat-value {
                font-size: 12px;
            }
            body {
                padding: 8px;
                gap: 8px;
            }
            .log-container {
                height: 70px;
            }
            .map-overlay-info {
                font-size: 9px;
                padding: 4px 8px;
            }
        }

        @media (max-width: 400px) {
            .stat-value {
                font-size: 10px;
            }
            .stat-label {
                font-size: 8px;
            }
            .dash-header {
                font-size: 11px;
            }
            .stats-grid {
                gap: 4px;
            }
            .stat-card {
                padding: 5px;
            }
            .log-container {
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <!-- TOP DASHBOARD -->
    <div class="dashboard">
        <div class="dash-header">
            <span>SOVEREIGN AI ENGINE</span>
            <div class="status-badge"><div class="status-dot"></div> 24/7 AUTONOMOUS</div>
        </div>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">DAY</div>
                <div class="stat-value" id="stat-day">1</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">ERA</div>
                <div class="stat-value val-era" id="stat-era">Era 1</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">POPULATION</div>
                <div class="stat-value val-pop" id="stat-pop">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">TREASURY</div>
                <div class="stat-value val-gold" id="stat-gold">0 G</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">TECH POWER</div>
                <div class="stat-value val-tech" id="stat-tech">0.0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">DEFENSES</div>
                <div class="stat-value" id="stat-tanks">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">STATUS</div>
                <div class="stat-value" style="color: #2ecc71;" id="stat-status">PEACE</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">BUILD</div>
                <div class="stat-value" id="stat-build" style="font-size: 10px;">v2.0</div>
            </div>
        </div>
    </div>

    <!-- MAP CONTAINER -->
    <div id="map-container">
        <div class="map-overlay-info">Drag to Pan | Scroll or Pinch to Zoom</div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- SYSTEM EVENT LOGS STREAM -->
    <div class="log-container">
        <div class="log-title">SYSTEM EVENT STREAM</div>
        <div id="log-stream">Connecting to AI Sovereign Neural Link...</div>
    </div>

    <script>
// ==== Optimized Pixel‑Art Engine ====
// Assumes a <canvas id="gameCanvas"></canvas> exists and a global `worldState` object:
// {
//   day: Number, pop: Number, tech: Number,
//   buildings: [{x,y,type}], units: [{x,y,dir}], activeEvents: ['blood_moon',...]
// }

(() => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const PIXEL = 2;                     // size of a "pixel" block
    const BUILD_W = 16, BUILD_H = 24;    // building base size in pixels
    const UNIT_W = 8, UNIT_H = 12;       // unit size in pixels
    const FPS = 60;
    let lastTime = 0;
    let resizePending = false;

    // ---------- Helpers ----------
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
    const toScreen = (x, y) => ({ x: Math.round(x), y: Math.round(y) });

    // ---------- Drawing Primitives ----------
    const fillRect = (x, y, w, h, col) => {
        ctx.fillStyle = col;
        ctx.fillRect(x, y, w, h);
    };

    // Pixel‑art building (simple roof, windows, door)
    const drawBuilding = (bx, by, type = 0) => {
        // base
        fillRect(bx, by - BUILD_H * PIXEL, BUILD_W * PIXEL, BUILD_H * PIXEL, '#7b5e57');
        // roof
        for (let i = 0; i < BUILD_W; i++) {
            const hue = (type * 30 + i * 5) % 360;
            fillRect(bx + i * PIXEL, by - (BUILD_H + 2) * PIXEL, PIXEL, PIXEL * 2,
                `hsl(${hue},40%,50%)`);
        }
        // windows
        for (let row = 2; row < BUILD_H - 2; row += 3) {
            for (let col = 2; col < BUILD_W - 2; col += 4) {
                fillRect(bx + col * PIXEL, by - row * PIXEL - PIXEL, PIXEL * 2, PIXEL * 2,
                    '#a9d6e5');
            }
        }
        // door
        fillRect(bx + (BUILD_W / 2 - 1) * PIXEL,
                 by - PIXEL * 2,
                 PIXEL * 2,
                 PIXEL * 2,
                 '#5c3d2e');
    };

    // Animated walking unit (simple two‑frame walk cycle)
    const drawUnit = (ux, uy, dir, frame) => {
        const baseY = uy - UNIT_H * PIXEL;
        // body
        fillRect(ux, baseY, UNIT_W * PIXEL, UNIT_H * PIXEL, '#ffb347');
        // head
        fillRect(ux + 2 * PIXEL, baseY - 4 * PIXEL, 4 * PIXEL, 4 * PIXEL, '#ffe0bd');
        // legs (simple animation)
        const offset = frame % 2 ? 1 : -1;
        const legY = baseY + UNIT_H * PIXEL - 2 * PIXEL;
        fillRect(ux + (dir === 'right' ? 2 : 6) * PIXEL,
                 legY + offset,
                 2 * PIXEL,
                 2 * PIXEL,
                 '#2c3e50');
        fillRect(ux + (dir === 'right' ? 6 : 2) * PIXEL,
                 legY - offset,
                 2 * PIXEL,
                 2 * PIXEL,
                 '#2c3e50');
    };

    // ---------- Event Overlays ----------
    const drawEventOverlay = (event, width, height, time) => {
        switch (event) {
            case 'blood_moon':
                ctx.globalAlpha = 0.2;
                ctx.fillStyle = 'rgba(150,0,0,0.5)';
                ctx.fillRect(0, 0, width, height);
                ctx.globalAlpha = 0.8;
                ctx.beginPath();
                ctx.arc(width * 0.8, height * 0.2, 30, 0, Math.PI * 2);
                ctx.fillStyle = 'red';
                ctx.fill();
                break;
            case 'fire':
                ctx.globalAlpha = 0.3;
                ctx.fillStyle = 'rgba(255,69,0,0.4)';
                ctx.fillRect(0, 0, width, height);
                // simple flame particles
                for (let i = 0; i < 15; i++) {
                    const px = Math.random() * width;
                    const py = Math.random() * height;
                    const r = Math.random() * 4 + 2;
                    ctx.beginPath();
                    ctx.arc(px, py, r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,${50 + Math.random() * 100},0,0.6)`;
                    ctx.fill();
                }
                break;
            case 'storm':
                ctx.globalAlpha = 0.25;
                ctx.fillStyle = 'rgba(0,0,50,0.5)';
                ctx.fillRect(0, 0, width, height);
                // lightning flash
                if (Math.floor(time / 500) % 2 === 0) {
                    ctx.globalAlpha = 0.6;
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(Math.random() * width, 0);
                    ctx.lineTo(Math.random() * width, height);
                    ctx.stroke();
                }
                break;
            case 'plague':
                ctx.globalAlpha = 0.2;
                ctx.fillStyle = 'rgba(0,150,0,0.4)';
                ctx.fillRect(0, 0, width, height);
                // floating green particles
                for (let i = 0; i < 12; i++) {
                    const px = Math.random() * width;
                    const py = Math.random() * height;
                    ctx.fillStyle = `rgba(0,200,0,${0.3 + Math.random() * 0.3})`;
                    ctx.fillRect(px, py, 3, 3);
                }
                break;
            case 'prosperity':
                ctx.globalAlpha = 0.3;
                for (let i = 0; i < 20; i++) {
                    const px = Math.random() * width;
                    const py = Math.random() * height;
                    ctx.fillStyle = `rgba(255,215,0,${0.5 + Math.random() * 0.5})`;
                    ctx.fillRect(px, py, 2, 2);
                }
                break;
        }
        ctx.globalAlpha = 1;
    };

    // ---------- Main Render ----------
    const render = (time) => {
        const dt = time - lastTime;
        if (dt < 1000 / FPS) {
            requestAnimationFrame(render);
            return;
        }
        lastTime = time;

        // Resize handling (debounced)
        if (resizePending) {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            resizePending = false;
        }

        const { width, height } = canvas;
        ctx.clearRect(0, 0, width, height);

        // Draw buildings
        worldState.buildings.forEach(b => {
            const bx = clamp(b.x, 0, width - BUILD_W * PIXEL);
            const by = clamp(b.y, BUILD_H * PIXEL, height);
            drawBuilding(bx, by, b.type || 0);
        });

        // Draw units (simple walk animation based on time)
        worldState.units.forEach((u, idx) => {
            const frame = Math.floor(time / 200 + idx) % 2;
            const ux = clamp(u.x, 0, width - UNIT_W * PIXEL);
            const uy = clamp(u.y, UNIT_H * PIXEL, height);
            drawUnit(ux, uy, u.dir || 'right', frame);
        });

        // Draw active events
        if (Array.isArray(worldState.activeEvents)) {
            worldState.activeEvents.forEach(ev => drawEventOverlay(ev, width, height, time));
        }

        requestAnimationFrame(render);
    };

    // ---------- Resize ----------
    const onResize = () => {
        resizePending = true;
    };
    window.addEventListener('resize', onResize);
    onResize(); // initial size

    // ---------- Start ----------
    requestAnimationFrame(render);
})();
</script>
</body>
</html>
