<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dark Fantasy Civ - Autonomous World</title>
    <!-- Load Pixi.js for isometric rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050811;
            font-family: 'Courier New', Courier, monospace;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .ui-panel {
            position: absolute;
            z-index: 10;
            background: rgba(10, 15, 28, 0.85);
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 12px;
            color: #e2e8f0;
            backdrop-filter: blur(6px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        #hud {
            top: 15px;
            left: 15px;
            right: 15px;
            font-size: 13px;
            pointer-events: none;
        }
        .hud-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 1px solid #334155;
        }
        .status-live {
            color: #22c55e;
        }
        .hud-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 12px;
        }
        .val { font-weight: bold; }
        .c-purple { color: #c084fc; }
        .c-gold { color: #facc15; }
        .c-cyan { color: #38bdf8; }
        .c-green { color: #4ade80; }

        #log-box {
            bottom: 15px;
            left: 15px;
            right: 15px;
            height: 110px;
            overflow-y: auto;
            font-size: 11px;
            line-height: 1.4;
            pointer-events: auto; /* Enabled touch interaction & scrolling */
            -webkit-overflow-scrolling: touch;
        }
        .log-entry {
            margin-bottom: 4px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- UPPER HUD OVERLAY -->
    <div id="hud" class="ui-panel">
        <div class="hud-header">
            <span>CLOUD STREAM 24/7</span>
            <span class="status-live">[CONNECTED 24/7]</span>
        </div>
        <div class="hud-grid">
            <div>Day: <span id="val-day" class="val c-gold">1</span></div>
            <div>Era: <span id="val-era" class="val c-purple">Era 1</span></div>
            <div>Ruler: <span id="val-ruler" class="val c-cyan">AI Sovereign</span></div>
            <div>Pop: <span id="val-pop" class="val c-green">0</span></div>
            <div>Tanks: <span id="val-tanks" class="val">0</span></div>
            <div>Gold: <span id="val-gold" class="val c-gold">0</span></div>
            <div>Build: <span id="val-build" class="val c-cyan">v1.0.0</span></div>
            <div>War: <span id="val-war" class="val c-green">PEACE</span></div>
        </div>
    </div>

    <!-- LOWER LOG PANEL -->
    <div id="log-box" class="ui-panel">
        <div id="log-content"></div>
    </div>

    <script>
        // ==========================================
        // 1. ENGINE & GRAPHICS INITIALIZATION
        // ==========================================
        const container = document.getElementById('canvas-container');
        const app = new PIXI.Application({
            width: window.innerWidth,
            height: window.innerHeight,
            backgroundColor: 0x050811,
            resizeTo: window,
            antialias: true
        });
        container.appendChild(app.view);

        // Main World Camera Container
        const worldContainer = new PIXI.Container();
        worldContainer.x = app.screen.width / 2;
        worldContainer.y = app.screen.height / 4;
        app.stage.addChild(worldContainer);

        // Sub-layers for clean rendering separation
        const mapLayer = new PIXI.Container();
        const entitiesLayer = new PIXI.Container();
        worldContainer.addChild(mapLayer);
        worldContainer.addChild(entitiesLayer);

        // Touch & Drag Camera Control
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        app.stage.eventMode = 'static';
        app.stage.hitArea = app.screen;

        app.stage.on('pointerdown', (e) => {
            isDragging = true;
            dragStart = { x: e.global.x - worldContainer.x, y: e.global.y - worldContainer.y };
        });
        app.stage.on('pointermove', (e) => {
            if (isDragging) {
                worldContainer.x = e.global.x - dragStart.x;
                worldContainer.y = e.global.y - dragStart.y;
            }
        });
        app.stage.on('pointerup', () => isDragging = false);
        app.stage.on('pointerupoutside', () => isDragging = false);

        // ==========================================
        // 2. ISOMETRIC MAP & BIOME SYSTEM
        // AI GENERATIVE HOOK: Extend biomes and tile logic here
        // ==========================================
        const GRID_SIZE = 20;
        const TILE_WIDTH = 48;
        const TILE_HEIGHT = 24;

        const BIOMES = {
            0: { name: "Grassland", color: 0x16a34a, border: 0x15803d }, // Green
            1: { name: "River",     color: 0x0284c7, border: 0x0369a1 }, // Blue
            2: { name: "Mountain",  color: 0x475569, border: 0x334155 }, // Grey
            3: { name: "Forest",    color: 0x15803d, border: 0x166534 }  // Dark Green
        };

        const mapData = [];
        for (let x = 0; x < GRID_SIZE; x++) {
            mapData[x] = [];
            for (let y = 0; y < GRID_SIZE; y++) {
                if (x === 10 || y === 10) mapData[x][y] = 1; // River spine
                else if ((x < 3 && y < 3) || (x > 16 && y > 16)) mapData[x][y] = 2; // Mountain ranges
                else if ((x + y) % 7 === 0) mapData[x][y] = 3; // Forest patches
                else mapData[x][y] = 0; // Grass field
            }
        }

        function isoToScreen(x, y) {
            return {
                x: (x - y) * (TILE_WIDTH / 2),
                y: (x + y) * (TILE_HEIGHT / 2)
            };
        }

        function renderMap() {
            mapLayer.removeChildren();
            for (let x = 0; x < GRID_SIZE; x++) {
                for (let y = 0; y < GRID_SIZE; y++) {
                    const biome = BIOMES[mapData[x][y]] || BIOMES[0];
                    const pos = isoToScreen(x, y);

                    const tile = new PIXI.Graphics();
                    tile.beginFill(biome.color, 0.85);
                    tile.lineStyle(1, biome.border, 0.5);

                    tile.moveTo(0, 0);
                    tile.lineTo(TILE_WIDTH / 2, TILE_HEIGHT / 2);
                    tile.lineTo(0, TILE_HEIGHT);
                    tile.lineTo(-TILE_WIDTH / 2, TILE_HEIGHT / 2);
                    tile.closePath();
                    tile.endFill();

                    tile.x = pos.x;
                    tile.y = pos.y;
                    mapLayer.addChild(tile);
                }
            }
        }
        renderMap();

        // ==========================================
        // 3. ADVANCED GRAPHICAL DRAWING HELPERS
        // ==========================================

        // Draws a detailed 3D Isometric Capital Citadel
        function drawCitadel(x, y) {
            const container = new PIXI.Container();
            const pos = isoToScreen(x, y);
            container.x = pos.x;
            container.y = pos.y;

            const g = new PIXI.Graphics();

            // Ground Shadow
            g.beginFill(0x000000, 0.4);
            g.drawEllipse(0, 8, 22, 11);
            g.endFill();

            // Base Walls
            g.beginFill(0x334155); // Dark Slate Left
            g.moveTo(-16, 0).lineTo(0, 8).lineTo(0, -12).lineTo(-16, -20).closePath().endFill();
            g.beginFill(0x475569); // Slate Right
            g.moveTo(0, 8).lineTo(16, 0).lineTo(16, -20).lineTo(0, -12).closePath().endFill();
            g.beginFill(0x64748b); // Top Wall Roof
            g.moveTo(-16, -20).lineTo(0, -12).lineTo(16, -20).lineTo(0, -28).closePath().endFill();

            // Central Royal Keep (Golden Citadel Spire)
            g.beginFill(0xd97706); // Dark Gold Left
            g.moveTo(-10, -22).lineTo(0, -17).lineTo(0, -42).lineTo(-10, -47).closePath().endFill();
            g.beginFill(0xf59e0b); // Gold Right
            g.moveTo(0, -17).lineTo(10, -22).lineTo(10, -47).lineTo(0, -42).closePath().endFill();
            g.beginFill(0xfacc15); // Top Roof
            g.moveTo(-10, -47).lineTo(0, -42).lineTo(10, -47).lineTo(0, -52).closePath().endFill();

            // Crown Gem / Spire Tip
            g.beginFill(0x38bdf8);
            g.drawCircle(0, -55, 3);
            g.endFill();

            // Banner Flag
            g.lineStyle(1.5, 0x94a3b8);
            g.moveTo(0, -52).lineTo(0, -64);
            g.lineStyle(0);
            g.beginFill(0xef4444);
            g.moveTo(0, -64).lineTo(7, -60).lineTo(0, -56).closePath();
            g.endFill();

            container.addChild(g);
            return container;
        }

        // Draws a detailed Military Combat Tank
        function drawTank(x, y) {
            const container = new PIXI.Container();
            const pos = isoToScreen(x, y);
            container.x = pos.x;
            container.y = pos.y;

            const g = new PIXI.Graphics();

            // Tank Drop Shadow
            g.beginFill(0x000000, 0.45);
            g.drawEllipse(0, 3, 10, 5);
            g.endFill();

            // Tread / Tracks
            g.beginFill(0x1e293b);
            g.drawRoundRect(-8, -4, 16, 8, 3);
            g.endFill();

            // Main Armored Hull
            g.beginFill(0xb91c1c); // Deep Red Armor
            g.drawRoundRect(-7, -7, 14, 8, 2);
            g.endFill();
            g.beginFill(0xef4444); // Top Armor Highlight
            g.drawRect(-5, -6, 10, 5);
            g.endFill();

            // Turret & Cannon Barrel
            g.beginFill(0x7f1d1d); // Turret Base
            g.drawCircle(0, -4, 4);
            g.endFill();

            g.lineStyle(2, 0x450a0a); // Heavy Cannon Barrel
            g.moveTo(2, -4).lineTo(9, -8);
            g.lineStyle(0);

            // Hatch Detail
            g.beginFill(0xfca5a5);
            g.drawCircle(-1, -5, 1.2);
            g.endFill();

            container.addChild(g);
            return container;
        }

        // Draws a Citizen House / Cottage
        function drawHouse(x, y) {
            const container = new PIXI.Container();
            const pos = isoToScreen(x, y);
            container.x = pos.x;
            container.y = pos.y;

            const g = new PIXI.Graphics();

            // Shadow
            g.beginFill(0x000000, 0.3);
            g.drawEllipse(0, 4, 10, 5);
            g.endFill();

            // Walls
            g.beginFill(0x78350f);
            g.drawRect(-6, -8, 12, 8);
            g.endFill();

            // Roof
            g.beginFill(0xb45309);
            g.moveTo(-8, -8).lineTo(0, -15).lineTo(8, -8).closePath();
            g.endFill();

            // Glowing Window
            g.beginFill(0xfef08a);
            g.drawRect(-3, -6, 3, 3);
            g.endFill();

            container.addChild(g);
            return container;
        }

        // Draws a Gold Vault / Bank Building
        function drawVault(x, y) {
            const container = new PIXI.Container();
            const pos = isoToScreen(x, y);
            container.x = pos.x;
            container.y = pos.y;

            const g = new PIXI.Graphics();

            // Base
            g.beginFill(0x1e293b);
            g.drawRect(-10, -10, 20, 10);
            g.endFill();

            // Vault Golden Dome
            g.beginFill(0xeab308);
            g.drawCircle(0, -10, 8);
            g.endFill();

            // Gold Coins Pile Outside
            g.beginFill(0xfacc15);
            g.drawCircle(-6, -1, 2);
            g.drawCircle(-3, 0, 2.5);
            g.drawCircle(5, -1, 2);
            g.endFill();

            container.addChild(g);
            return container;
        }

        // ==========================================
        // 4. DYNAMIC ENTITY RENDERER
        // ==========================================
        function updateEntities(state) {
            entitiesLayer.removeChildren();

            // 1. Render Capital Citadel (Centered at 6, 6)
            const citadel = drawCitadel(6, 6);
            entitiesLayer.addChild(citadel);

            // 2. Render Gold Vault if Treasury is High (> 10,000)
            if ((state.treasury || 0) > 10000) {
                const vault = drawVault(8, 6);
                entitiesLayer.addChild(vault);
            }

            // 3. Render Houses according to Population
            const pop = state.population || 0;
            const houseSlots = [
                {x: 5, y: 7}, {x: 7, y: 5}, {x: 7, y: 7}, {x: 5, y: 5},
                {x: 4, y: 6}, {x: 6, y: 4}, {x: 8, y: 7}, {x: 7, y: 8}
            ];
            const houseCount = Math.min(Math.ceil(pop / 2), houseSlots.length);
            for (let i = 0; i < houseCount; i++) {
                const slot = houseSlots[i];
                const house = drawHouse(slot.x, slot.y);
                entitiesLayer.addChild(house);
            }

            // 4. Render Military Tanks based on server state
            const tankCount = Math.min(state.tanks || 0, 25);
            for (let i = 0; i < tankCount; i++) {
                const tx = 3 + (i % 5) * 2;
                const ty = 12 + Math.floor(i / 5) * 2;
                const tank = drawTank(tx, ty);
                entitiesLayer.addChild(tank);
            }

            // Sort entities layer by vertical position for correct isometric depth
            entitiesLayer.children.sort((a, b) => a.y - b.y);
        }

        // ==========================================
        // 5. BACKGROUND AMBIENT PARTICLES
        // ==========================================
        const particles = [];
        for (let i = 0; i < 30; i++) {
            const p = new PIXI.Graphics();
            p.beginFill(0x38bdf8, Math.random() * 0.5 + 0.2);
            p.drawCircle(0, 0, Math.random() * 3 + 1);
            p.endFill();
            p.x = Math.random() * app.screen.width;
            p.y = Math.random() * app.screen.height;
            p.vy = Math.random() * -0.5 - 0.2;
            app.stage.addChild(p);
            particles.push(p);
        }

        app.ticker.add(() => {
            particles.forEach(p => {
                p.y += p.vy;
                if (p.y < 0) p.y = app.screen.height;
            });
        });

        window.addEventListener('resize', () => {
            worldContainer.x = app.screen.width / 2;
            worldContainer.y = app.screen.height / 4;
        });

        // ==========================================
        // 6. WEBSOCKET REAL-TIME SYNC
        // ==========================================
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}`;
        const socket = new WebSocket(wsUrl);

        socket.onmessage = (event) => {
            const message = JSON.parse(event.data);
            if (message.type === 'WORLD_UPDATE') {
                const data = message.data;

                // Sync HUD values
                document.getElementById('val-day').innerText = data.day;
                document.getElementById('val-era').innerText = data.era;
                document.getElementById('val-ruler').innerText = data.ruler;
                document.getElementById('val-pop').innerText = data.population;
                document.getElementById('val-tanks').innerText = data.tanks;
                document.getElementById('val-gold').innerText = data.treasury;
                document.getElementById('val-build').innerText = data.engineBuild;
                document.getElementById('val-war').innerText = data.inWar ? 'IN WAR' : 'PEACE';

                // Sync event log entries & auto-scroll to bottom
                if (data.logs) {
                    const logContainer = document.getElementById('log-content');
                    logContainer.innerHTML = data.logs.map(l => `<div class="log-entry">${l}</div>`).join('');
                    const logBox = document.getElementById('log-box');
                    logBox.scrollTop = logBox.scrollHeight;
                }

                // Render dynamically updated visual entities
                updateEntities(data);
            }
        };
    </script>
</body>
</html>
